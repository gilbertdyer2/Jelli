<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jelli — Audio Visualizer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050510;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  canvas#canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: block;
  }

  /* ── Top bar ──────────────────────────────────────────────────── */
  #ui-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: rgba(5, 5, 20, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(100, 180, 255, 0.12);
    z-index: 10;
  }

  #ui-bar select {
    flex: 1;
    max-width: 380px;
    background: rgba(10, 10, 30, 0.9);
    color: #a8c8ff;
    border: 1px solid rgba(100, 180, 255, 0.25);
    border-radius: 5px;
    padding: 4px 8px;
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  #ui-bar select:hover { border-color: rgba(100, 180, 255, 0.55); }

  #play-btn {
    background: rgba(0, 200, 255, 0.12);
    color: #00c8ff;
    border: 1px solid rgba(0, 200, 255, 0.35);
    border-radius: 5px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  #play-btn:hover { background: rgba(0, 200, 255, 0.22); border-color: rgba(0, 200, 255, 0.65); }

  #live-btn {
    background: rgba(0, 210, 120, 0.10);
    color: #00d878;
    border: 1px solid rgba(0, 210, 120, 0.30);
    border-radius: 5px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  #live-btn:hover  { background: rgba(0, 210, 120, 0.20); border-color: rgba(0, 210, 120, 0.60); }
  #live-btn.active { background: rgba(0, 210, 120, 0.28); border-color: rgba(0, 210, 120, 0.75); color: #40ffaa; }

  /* ── Spawn modal ─────────────────────────────────────────────────── */
  #spawn-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 2, 14, 0.80);
    backdrop-filter: blur(6px);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  #spawn-modal.open { display: flex; }
  #spawn-card {
    background: rgba(8, 8, 28, 0.97);
    border: 1px solid rgba(100, 180, 255, 0.22);
    border-radius: 10px;
    padding: 18px 20px 14px;
    width: 300px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  #spawn-card h3 {
    color: #a8c8ff;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .sp-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .sp-lbl {
    color: rgba(150, 195, 240, 0.75);
    font-size: 11px;
    width: 78px;
    flex-shrink: 0;
  }
  .sp-row input[type=range] { flex: 1; }
  .sp-row input[type=number],
  .sp-row input[type=text],
  .sp-row select {
    flex: 1;
    background: rgba(10,10,30,0.9);
    color: #a8c8ff;
    border: 1px solid rgba(100,180,255,0.22);
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .sp-row input[type=color] {
    width: 38px; height: 24px;
    border: 1px solid rgba(100,180,255,0.22);
    border-radius: 4px;
    background: none;
    cursor: pointer;
    padding: 1px;
  }
  .sp-val {
    color: rgba(130,170,215,0.65);
    font-size: 10px;
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }
  #spawn-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  #spawn-ok, #spawn-cancel {
    border-radius: 5px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid;
    font-family: inherit;
    transition: background 0.15s;
  }
  #spawn-ok     { background: rgba(0,200,255,0.13); color: #00c8ff; border-color: rgba(0,200,255,0.38); }
  #spawn-ok:hover { background: rgba(0,200,255,0.24); }
  #spawn-cancel { background: rgba(180,180,200,0.05); color: rgba(170,180,210,0.65); border-color: rgba(180,180,200,0.18); }
  #spawn-cancel:hover { background: rgba(180,180,200,0.11); }

  /* ── Jellyfish chips ─────────────────────────────────────────────── */
  #jelli-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex-shrink: 0;
  }
  #jelli-list-label {
    width: 100%;
    color: rgba(140, 170, 215, 0.40);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }
  .jelli-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    padding: 2px 7px 2px 6px;
    font-size: 11px;
    color: rgba(190,215,255,0.75);
  }
  .jelli-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .jelli-remove {
    background: none;
    border: none;
    color: rgba(170,170,200,0.38);
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    line-height: 1;
    font-family: inherit;
    margin-left: 1px;
  }
  .jelli-remove:hover { color: rgba(255,90,90,0.85); }

  #clam-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    flex-shrink: 0;
  }
  #clam-list-label {
    width: 100%;
    color: rgba(140, 170, 215, 0.40);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }
  .clam-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    padding: 2px 7px 2px 6px;
    font-size: 11px;
    color: rgba(190,215,255,0.75);
  }
  .clam-dot {
    width: 7px; height: 7px;
    border-radius: 2px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .clam-remove {
    background: none;
    border: none;
    color: rgba(170,170,200,0.38);
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    line-height: 1;
    font-family: inherit;
    margin-left: 1px;
  }
  .clam-remove:hover { color: rgba(255,90,90,0.85); }

  #status {
    color: rgba(150, 180, 220, 0.7);
    font-size: 11px;
    white-space: nowrap;
    min-width: 80px;
  }

  /* ── Bottom panel ─────────────────────────────────────────────── */
  #bottom-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 24px;
    background: rgba(4, 4, 18, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(100, 180, 255, 0.12);
    z-index: 10;
    transition: height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #bottom-panel.open  { max-height: calc(100vh - 85px); }
  #bottom-panel.resizing { transition: none; }

  /* Drag handle — thin strip at the very top of the panel */
  #panel-resize {
    height: 5px;
    cursor: ns-resize;
    flex-shrink: 0;
    background: transparent;
    transition: background 0.15s;
  }
  #panel-resize:hover { background: rgba(100, 180, 255, 0.08); }

  /* Header row: toggle chevron + tab strip */
  #panel-header {
    flex-shrink: 0;
    height: 24px;
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid rgba(100, 180, 255, 0.07);
  }
  #panel-toggle {
    width: 28px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(140, 170, 215, 0.55);
    font-size: 9px;
    user-select: none;
    border-right: 1px solid rgba(100, 180, 255, 0.07);
    transition: color 0.15s, background 0.15s;
  }
  #panel-toggle:hover {
    color: rgba(160, 200, 255, 0.95);
    background: rgba(100, 180, 255, 0.04);
  }
  #panel-arrow {
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  #bottom-panel.open #panel-arrow { transform: rotate(180deg); }

  #panel-tabs {
    display: flex;
    align-items: stretch;
    padding: 0 4px;
    gap: 2px;
  }
  .panel-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: rgba(140, 170, 215, 0.42);
    font-size: 11px;
    padding: 0 13px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.04em;
    align-self: stretch;
    transition: color 0.15s;
  }
  .panel-tab:hover { color: rgba(160, 200, 255, 0.75); }
  .panel-tab.active {
    color: rgba(160, 200, 255, 0.95);
    border-bottom-color: rgba(100, 180, 255, 0.5);
  }

  /* Tab content */
  #panel-content {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }
  .tab-pane {
    display: none;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .tab-pane.active { display: flex; }

  /* Controls tab — left creatures column + right sliders column */
  #tab-controls { flex-direction: row; }

  #creatures-panel {
    width: 195px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(100, 180, 255, 0.08);
    overflow-y: auto;
    padding: 8px 10px;
    gap: 10px;
  }
  #creatures-panel::-webkit-scrollbar { width: 3px; }
  #creatures-panel::-webkit-scrollbar-track { background: transparent; }
  #creatures-panel::-webkit-scrollbar-thumb { background: rgba(100, 180, 255, 0.18); border-radius: 2px; }

  .creature-section { display: flex; flex-direction: column; gap: 5px; }

  .creature-spawn-btn {
    background: rgba(100, 180, 255, 0.06);
    color: rgba(140, 180, 240, 0.65);
    border: 1px solid rgba(100, 180, 255, 0.15);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 10px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .creature-spawn-btn:hover {
    background: rgba(100, 180, 255, 0.13);
    color: rgba(180, 210, 255, 0.95);
  }

  /* Analysis tab — same three-column layout as the old panel content */
  #tab-analysis {
    flex-direction: row;
    gap: 14px;
    padding: 8px 14px 10px;
  }

  /* EQ section */
  #eq-section {
    display: flex;
    flex-direction: column;
    width: 50%;
    flex-shrink: 0;
    min-width: 0;
    min-height: 0;
  }
  #eq-label {
    color: rgba(140, 170, 215, 0.45);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 5px;
  }
  #eq-canvas {
    flex: 1;
    width: 100%;
    display: block;
    border-radius: 3px;
    background: #020208;
    border: 1px solid rgba(100, 180, 255, 0.07);
  }

  /* Log section */
  #log-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  #log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  #log-header span {
    color: rgba(140, 170, 215, 0.45);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  #clear-log-btn {
    background: transparent;
    color: rgba(140, 170, 215, 0.38);
    border: 1px solid rgba(100, 180, 255, 0.14);
    border-radius: 3px;
    padding: 1px 8px;
    font-size: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  #clear-log-btn:hover {
    color: rgba(160, 200, 255, 0.85);
    border-color: rgba(100, 180, 255, 0.35);
  }
  #beat-log {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    line-height: 1.6;
    padding-right: 4px;
  }
  #beat-log::-webkit-scrollbar { width: 4px; }
  #beat-log::-webkit-scrollbar-track { background: transparent; }
  #beat-log::-webkit-scrollbar-thumb { background: rgba(100, 180, 255, 0.18); border-radius: 2px; }

  .log-entry { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-time   { color: rgba(120, 150, 190, 0.38); }
  .log-det    { font-weight: 600; }
  .log-ivl    { color: rgba(120, 150, 190, 0.4); font-size: 10px; }

  /* ── Detector graphs ──────────────────────────────────────────── */
  #graphs-section {
    width: 200px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid rgba(100, 180, 255, 0.08);
    padding-left: 12px;
  }
  #graphs-label {
    color: rgba(140, 170, 215, 0.45);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 5px;
    flex-shrink: 0;
  }
  #graphs-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-height: 0;
    overflow: hidden;
  }
  .det-graph-row {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .det-graph-lbl {
    font-size: 9px;
    flex-shrink: 0;
    margin-bottom: 2px;
    letter-spacing: 0.04em;
    font-family: 'Consolas', 'Cascadia Code', monospace;
  }
  .det-graph-cv {
    flex: 1;
    width: 100%;
    display: block;
    background: #020208;
    border-radius: 2px;
    border: 1px solid rgba(100, 180, 255, 0.07);
  }

  /* ── Playback bar ─────────────────────────────────────────────── */
  #playback-bar {
    position: fixed;
    top: 44px; left: 0; right: 0;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: rgba(4, 4, 18, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(100, 180, 255, 0.08);
    z-index: 10;
  }

  .pb-time {
    color: rgba(150, 180, 220, 0.5);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 34px;
    font-family: 'Consolas', 'Cascadia Code', monospace;
  }
  #time-total { text-align: right; }

  #scrub-track {
    flex: 1;
    height: 16px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  #scrub-rail {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: rgba(100, 180, 255, 0.13);
    border-radius: 2px;
    pointer-events: none;
  }
  #scrub-fill {
    position: absolute;
    left: 0;
    height: 3px;
    width: 0%;
    background: rgba(0, 200, 255, 0.72);
    border-radius: 2px;
    pointer-events: none;
    transition: width 0.08s linear;
  }
  #scrub-track.is-scrubbing #scrub-fill { transition: none; }

  #scrub-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 11px; height: 11px;
    background: #00c8ff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    box-shadow: 0 0 6px rgba(0, 200, 255, 0.55);
  }
  #scrub-track:hover #scrub-thumb,
  #scrub-track.is-scrubbing #scrub-thumb { opacity: 1; }

  /* ── Sliders panel ────────────────────────────────────────────── */
  #sliders-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    border-left: 1px solid rgba(100, 180, 255, 0.08);
    padding: 8px 0 10px 12px;
  }
  #sliders-header-label {
    color: rgba(140, 170, 215, 0.45);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  #sliders-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #sliders-scroll::-webkit-scrollbar { width: 3px; }
  #sliders-scroll::-webkit-scrollbar-track { background: transparent; }
  #sliders-scroll::-webkit-scrollbar-thumb { background: rgba(100, 180, 255, 0.18); border-radius: 2px; }

  .ctrl-group { margin-bottom: 7px; }
  .ctrl-group-label {
    color: rgba(120, 155, 210, 0.42);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding-bottom: 3px;
    margin-bottom: 3px;
    border-bottom: 1px solid rgba(100, 180, 255, 0.07);
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
  }
  .ctrl-label {
    flex: 1;
    color: rgba(160, 190, 230, 0.62);
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .ctrl-slider {
    width: 62px;
    flex-shrink: 0;
    height: 2px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(80, 140, 220, 0.22);
    border-radius: 1px;
    outline: none;
    cursor: pointer;
  }
  .ctrl-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px; height: 9px;
    background: #4488dd;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 4px rgba(68, 136, 220, 0.45);
  }
  .ctrl-slider::-moz-range-thumb {
    width: 9px; height: 9px;
    background: #4488dd;
    border-radius: 50%;
    border: none;
    cursor: pointer;
  }
  .ctrl-val {
    color: rgba(140, 185, 255, 0.52);
    font-size: 9px;
    font-family: 'Consolas', 'Cascadia Code', monospace;
    width: 36px;
    text-align: right;
    flex-shrink: 0;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(100, 180, 255, 0.12);
    outline: none;
    cursor: text;
    padding: 0;
  }
  .ctrl-val:focus {
    border-bottom-color: rgba(100, 180, 255, 0.45);
    color: rgba(160, 210, 255, 0.85);
  }

  /* Toggle switch used for boolean controls */
  .ctrl-toggle {
    position: relative;
    display: inline-block;
    width: 30px;
    height: 14px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .ctrl-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .ctrl-toggle-track {
    position: absolute;
    inset: 0;
    background: rgba(60, 80, 120, 0.4);
    border: 1px solid rgba(100, 160, 220, 0.2);
    border-radius: 7px;
    transition: background 0.18s, border-color 0.18s;
  }
  .ctrl-toggle-track::before {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    top: 1px; left: 1px;
    background: rgba(140, 170, 215, 0.55);
    border-radius: 50%;
    transition: transform 0.18s, background 0.18s;
  }
  .ctrl-toggle input:checked ~ .ctrl-toggle-track {
    background: rgba(68, 136, 220, 0.55);
    border-color: rgba(68, 136, 220, 0.5);
  }
  .ctrl-toggle input:checked ~ .ctrl-toggle-track::before {
    transform: translateX(16px);
    background: #5599ee;
  }
  .ctrl-color {
    width: 38px; height: 20px;
    border: 1px solid rgba(100,180,255,0.22);
    border-radius: 4px;
    background: none;
    cursor: pointer;
    padding: 1px;
    flex-shrink: 0;
  }
  .ctrl-color-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    margin-top: 4px;
  }
  .ctrl-color-cell {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .ctrl-color-cell-lbl {
    color: rgba(160, 190, 230, 0.62);
    font-size: 9px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 54px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui-bar">
  <select id="file-select"><option value="">— select audio file —</option></select>
  <button id="play-btn">Play</button>
  <button id="live-btn">🎤 Live</button>
  <span id="status">Idle</span>
</div>

<div id="playback-bar">
  <span class="pb-time" id="time-current">0:00</span>
  <div id="scrub-track">
    <div id="scrub-rail"></div>

}

function rand(min, max)    { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function lerp(a, b, t)     { return a + (b - a) * t; }

function formatTime(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);

function _createBlobGeometry(cfg) {
    const w = canvas.width;
    const h = canvas.height;
    const cx = cfg.cx ?? w * (0.2 + Math.random() * 0.6);
    const cy = cfg.cy ?? h * 0.42 + rand(-h * 0.08, h * 0.08);
    const bellRad = BELL_RADIUS;        // dome visual size
    const rootRad = BLOB_REST_RADIUS;   // tentacle attachment spread
    const rimParticles = [];

    for (let i = 0; i < BELL_RIM_COUNT; i++) {
        const θ  = (i / (BELL_RIM_COUNT - 1)) * Math.PI;
        const rx = Math.cos(θ) * bellRad;
        const ry = -Math.sin(θ) * bellRad;
        rimParticles.push({ rx, ry, x: cx + rx, y: cy + ry, vx: 0, vy: 0, rim: true });
    }
    const BELL_INTERIOR = 18;
    for (let i = 0; i < BELL_INTERIOR; i++) {
        const θ  = rand(0.05, 0.95) * Math.PI;
        const r  = rand(0.10, 0.88) * bellRad;
        const rx = Math.cos(θ) * r;
        const ry = -Math.sin(θ) * r;
        rimParticles.push({ rx, ry, x: cx + rx, y: cy + ry, vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), rim: false });
    }

    const segCount = Math.max(3, Math.round(BLOB_PARTICLE_COUNT));
    const tentacles = [];
    for (let t = 0; t < TENTACLE_COUNT; t++) {
        const rootOffX = lerp(-rootRad * 0.88, rootRad * 0.88, t / (TENTACLE_COUNT - 1));
        const chain = [];
        for (let s = 0; s < segCount; s++) {
            const tx = cx + rootOffX + rand(-2, 2);
            const ty = cy + s * TENTACLE_SEG_LEN;
            chain.push({ x: tx, y: ty, px: tx, py: ty });
        }
        tentacles.push(chain);
    }

    const _blobColor       = cfg.color       ?? '#00c8ff';
    const _blobEffectColor = cfg.effectColor ?? cfg.color ?? '#00c8ff';
    const [colorR, colorG, colorB]   = _hexRgb(_blobColor);
    const [effectR, effectG, effectB] = _hexRgb(_blobEffectColor);
    return {
        cx, cy,
        cvx: rand(-0.2, 0.2), cvy: rand(-0.15, 0.15),
        bkx: 0, bky: 0,
        color:          _blobColor,
        colorR, colorG, colorB,
        effect:         cfg.effect      ?? 'none',
        effectColor:    _blobEffectColor,
        effectR, effectG, effectB,
        effectSpeed:    cfg.effectSpeed ?? 1.0,
        kickScale:      cfg.kickScale   ?? 1.0,
        name:           cfg.name        ?? 'Jelli',
        detectorHz:     cfg.detectorHz      ?? 100,
        detectorRangeHz:cfg.detectorRangeHz ?? 20,
        detectorOctaves:cfg.detectorOctaves ?? 1,
        detectorDuration:cfg.detectorDuration ?? 8,
        detector:       null,
        _lastLogTime:   0,
        expandScale:         0,
        inflateScale:        1.0,
        tentacleSpreadScale: 1.0,  // root-spread multiplier; >1 fans tentacles outward on trigger
        energy:              ENERGY_MAX,
        thrustRemaining:     0,
        expandRemaining:     0,
        idlePhase:      rand(0, Math.PI * 2),
        angle:          0,
        targetAngle:    0,
        rimParticles,
        rimOnly:        rimParticles.filter(p => p.rim),
        tentacles,
        // Spotlight state
        activitySmooth: 0,   // decaying beat-activity signal (1.0 on trigger → 0 over ~2.5 s)
        soloMs:         0,   // accumulated ms as the sole active blob
        spotlightAlpha: 0,   // current rendered spotlight opacity
        triggerTimes:   [],  // timestamps of recent beat triggers (used for duo sync detection)
    };
}

// ─── Clam geometry init ───────────────────────────────────────────────────────
function _createClamGeometry(cfg) {
    const w  = canvas.width;
    const h  = canvas.height;
    const cx = cfg.cx ?? w * (0.2 + Math.random() * 0.6);
    const cy = cfg.cy ?? h * 0.58 + rand(-h * 0.06, h * 0.06);

    const particles = [];

    // Upper shell rim — semicircle arc from right lip (shellW, 0) through crown (0, -shellH)
    // to left lip (-shellW, 0). Same angular convention as jellyfish bell.
    for (let i = 0; i < CLAM_RIM_UPPER; i++) {
        const θ  = (i / (CLAM_RIM_UPPER - 1)) * Math.PI;
        const rx =  Math.cos(θ) * CLAM_SHELL_W;
        const ry = -Math.sin(θ) * CLAM_SHELL_H;
        particles.push({ rx, ry, x: cx + rx, y: cy + ry, vx: 0, vy: 0, rim: true, halfBit: 1 });
    }
    // Upper interior
    for (let i = 0; i < CLAM_INT_UPPER; i++) {
        const θ  = rand(0.05, 0.95) * Math.PI;
        const r  = rand(0.15, 0.85);
        const rx =  Math.cos(θ) * CLAM_SHELL_W * r;
        const ry = -Math.sin(θ) * CLAM_SHELL_H * r;
        particles.push({ rx, ry, x: cx + rx, y: cy + ry, vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), rim: false, halfBit: 1 });
    }
    // Lower shell rim — shallow arc downward
    for (let i = 0; i < CLAM_RIM_LOWER; i++) {
        const θ  = (i / (CLAM_RIM_LOWER - 1)) * Math.PI;
        const rx =  Math.cos(θ) * CLAM_SHELL_W;
        const ry =  Math.sin(θ) * CLAM_SHELL_BLOW;
        particles.push({ rx, ry, x: cx + rx, y: cy + ry, vx: 0, vy: 0, rim: true, halfBit: 0 });
    }
    // Lower interior
    for (let i = 0; i < CLAM_INT_LOWER; i++) {
        const θ  = rand(0.05, 0.95) * Math.PI;
        const r  = rand(0.2, 0.8);
        const rx =  Math.cos(θ) * CLAM_SHELL_W * r;
        const ry =  Math.sin(θ) * CLAM_SHELL_BLOW * r;
        particles.push({ rx, ry, x: cx + rx, y: cy + ry, vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), rim: false, halfBit: 0 });
    }

    const upperRim = particles.filter(p => p.rim && p.halfBit === 1);
    const lowerRim = particles.filter(p => p.rim && p.halfBit === 0);

    const _clamColor       = cfg.color       ?? '#d4924a';
    const _clamEffectColor = cfg.effectColor ?? cfg.color ?? '#d4924a';
    const [colorR, colorG, colorB]    = _hexRgb(_clamColor);
    const [effectR, effectG, effectB] = _hexRgb(_clamEffectColor);

    return {
        cx, cy,
        cvx: 0, cvy: 0,
        angle: 0, spinVel: 0,
        openAmount: 0, openVel: 0,
        idlePhase: rand(0, Math.PI * 2),
        color:       _clamColor,  colorR, colorG, colorB,
        effectColor: _clamEffectColor, effectR, effectG, effectB,
        effect:      cfg.effect      ?? 'none',
        effectSpeed: cfg.effectSpeed ?? 1.0,
        kickScale:   cfg.kickScale   ?? 1.0,
        name:        cfg.name        ?? 'Clam',
        detectorHz:       cfg.detectorHz       ?? 58,
        detectorRangeHz:  cfg.detectorRangeHz  ?? 15,
        detectorOctaves:  cfg.detectorOctaves  ?? 1,
        detectorDuration: cfg.detectorDuration ?? 8,
        detector:    null,
        _lastLogTime: 0,
        activitySmooth: 0,
        soloMs:         0,
        spotlightAlpha: 0,
        triggerTimes:   [],
        particles, upperRim, lowerRim,
        type: 'clam',
    };
}

function initBlobs() {
    blobs = [];
    const w = canvas.width;
    for (let bi = 0; bi < DEFAULT_BLOBS.length; bi++) {
        const cfg = { ...DEFAULT_BLOBS[bi], cx: w * ((bi + 1) / (DEFAULT_BLOBS.length + 1)) };
        blobs.push(_createBlobGeometry(cfg));
    }
}

// Reinit blob geometry (e.g. after particle count change) preserving all config.
function reinitBlobs() {
    const saved = blobs.map(b => ({
        cx: b.cx, cy: b.cy,
        color: b.color, effect: b.effect, effectColor: b.effectColor,
        effectSpeed: b.effectSpeed, kickScale: b.kickScale,
        name: b.name, detector: b.detector, _lastLogTime: b._lastLogTime,
        detectorHz: b.detectorHz, detectorRangeHz: b.detectorRangeHz,
        detectorOctaves: b.detectorOctaves, detectorDuration: b.detectorDuration,
    }));
    blobs = [];
    for (const cfg of saved) {
        const blob = _createBlobGeometry(cfg);
        blob.detector = cfg.detector;
        blob._lastLogTime = cfg._lastLogTime;
        blobs.push(blob);
    }
    buildJelliList();
    buildFreqSliders();
}

// Reinit clam geometry (e.g. after shell dimension change) preserving physics state and config.
function reinitClams() {
    const saved = clams.map(c => ({
        cx: c.cx, cy: c.cy,
        angle: c.angle, spinVel: c.spinVel,
        cvx: c.cvx, cvy: c.cvy,
        color: c.color, effectColor: c.effectColor,
        effect: c.effect, effectSpeed: c.effectSpeed, kickScale: c.kickScale,
        name: c.name, detector: c.detector, _lastLogTime: c._lastLogTime,
        detectorHz: c.detectorHz, detectorRangeHz: c.detectorRangeHz,
        detectorOctaves: c.detectorOctaves, detectorDuration: c.detectorDuration,
    }));
    clams = [];
    for (const cfg of saved) {
        const clam = _createClamGeometry(cfg);
        clam.detector     = cfg.detector;
        clam._lastLogTime = cfg._lastLogTime;
        // Restore continuous physics state so movement feels uninterrupted
        clam.angle   = cfg.angle;
        clam.spinVel = cfg.spinVel;
        clam.cvx     = cfg.cvx;
        clam.cvy     = cfg.cvy;
        clams.push(clam);
    }
    buildClamList();
    buildFreqSliders();
}

function spawnJellyfish(cfg) {
    const blob = _createBlobGeometry(cfg);
    blobs.push(blob);
    // Create detector immediately if audio is active
    if (manager?.analyser || liveMode) {
        blob.detector = new BeatDetector({
            targetHz:        blob.detectorHz,

            octaves:         blob.detectorOctaves,
            triggerDuration: blob.detectorDuration,

    if (bi < 0 || bi >= blobs.length) return;
    blobs.splice(bi, 1);
    buildJelliList();
    buildFreqSliders();
}

    const list = document.getElementById('jelli-list');
    if (!list) return;
    // Clear all chips (keep the label div)
    const label = list.querySelector('#jelli-list-label');
    list.innerHTML = '';
    if (label) list.appendChild(label);

    for (let bi = 0; bi < blobs.length; bi++) {
        const blob = blobs[bi];
        const chip = document.createElement('div');
        chip.className = 'jelli-chip';

        const dot = document.createElement('span');
        dot.className = 'jelli-dot';
        dot.style.background = blob.color;

        list.appendChild(chip);

// ─── Jellyfish physics ────────────────────────────────────────────────────────
function updateBlobs() {
    for (const blob of blobs) {
        const param = blob.detector ? blob.detector.parameter : 0;

        // ── Center drift ──────────────────────────────────────────────────────
        const isDragged = (blob === draggedBlob);

        // Skip random jitter for dragged blob — it feeds into the velocity used for
        // rotation targeting and causes erratic spinning while the blob is held.
        if (!isDragged) {
            blob.cvx += rand(-BLOB_DRIFT_ACCEL, BLOB_DRIFT_ACCEL);
            blob.cvy += rand(-BLOB_DRIFT_ACCEL, BLOB_DRIFT_ACCEL);
        }

        if (isDragged) {
            // Elastic-rope pull: acceleration proportional to distance from cursor
            blob.cvx += (dragCursorX - blob.cx) * DRAG_SPRING_K;
            blob.cvy += (dragCursorY - blob.cy) * DRAG_SPRING_K;
        } else {
            // Soft edge repulsion (skipped while dragging so the blob moves freely)
            if (blob.cx < BLOB_MARGIN)                 blob.cvx += 0.045;
            if (blob.cx > canvas.width  - BLOB_MARGIN) blob.cvx -= 0.045;
            if (blob.cy < TOP_CLEAR + BLOB_MARGIN)      blob.cvy += 0.045;
            if (blob.cy > canvas.height - BLOB_MARGIN)  blob.cvy -= 0.045;
        }

        // Drift speed cap — raised while dragging so the blob can keep up with fast cursor movement
        const dMax = isDragged ? 6 : BLOB_DRIFT_MAX;
        const dspd = Math.sqrt(blob.cvx ** 2 + blob.cvy ** 2);
        if (dspd > dMax) { blob.cvx *= dMax / dspd; blob.cvy *= dMax / dspd; }

        // Kick-channel edge bounce (skipped while dragging)
        if (!isDragged) {
            if (blob.cx < BLOB_MARGIN)                 blob.bkx =  Math.abs(blob.bkx);
            if (blob.cx > canvas.width  - BLOB_MARGIN) blob.bkx = -Math.abs(blob.bkx);
            if (blob.cy < TOP_CLEAR + BLOB_MARGIN)      blob.bky =  Math.abs(blob.bky);
            if (blob.cy > canvas.height - BLOB_MARGIN)  blob.bky = -Math.abs(blob.bky);
        }

        // ── Drain thrust: apply KICK_ACCEL fraction of pending thrust each frame ──
        if (blob.thrustRemaining > 0.0005) {
            const t = blob.thrustRemaining * KICK_ACCEL;
            blob.bkx += Math.sin(blob.angle) * t;
            blob.bky -= Math.cos(blob.angle) * t;
            blob.thrustRemaining -= t;
        } else {
            blob.thrustRemaining = 0;
        }

        blob.bkx *= BLOB_BEAT_KICK_DECAY;
        blob.bky *= BLOB_BEAT_KICK_DECAY;

        blob.cx += blob.cvx + blob.bkx;
        blob.cy += blob.cvy + blob.bky;
        blob.cx = Math.max(BLOB_REST_RADIUS, Math.min(canvas.width  - BLOB_REST_RADIUS, blob.cx));
        blob.cy = Math.max(TOP_CLEAR + BLOB_REST_RADIUS, Math.min(canvas.height - BLOB_REST_RADIUS, blob.cy));

        // ── Orientation ───────────────────────────────────────────────────────
        const totalVx = blob.cvx + blob.bkx;
        const totalVy = blob.cvy + blob.bky;
        const speed   = Math.sqrt(totalVx * totalVx + totalVy * totalVy);

        if (isDragged) {
            // While held, face toward the cursor directly — the cursor vector is
            // stable and noise-free, preventing erratic spinning from jitter.
            const cdx = dragCursorX - blob.cx;
            const cdy = dragCursorY - blob.cy;
            if (Math.hypot(cdx, cdy) > 8) {
                blob.targetAngle = Math.atan2(cdx, -cdy);
            }
        } else {
            // Normal: derive heading from total velocity when moving fast enough.
            if (speed > 0.08) {
                blob.targetAngle = Math.atan2(totalVx, -totalVy);
            }
        }

        // Shortest-path EMA toward targetAngle.
        // Turn rate scales with speed so near-motionless blobs barely rotate —
        // prevents erratic spinning from tiny, noisy velocity fluctuations.
        let dAngle = blob.targetAngle - blob.angle;
        if (dAngle >  Math.PI) dAngle -= Math.PI * 2;
        if (dAngle < -Math.PI) dAngle += Math.PI * 2;
        const turnRate = isDragged ? ROTATION_SMOOTH : ROTATION_SMOOTH * Math.min(1, speed / 0.35);
        blob.angle += dAngle * Math.max(0.003, turnRate);

        // Gentle forward nudge while actively turning — jellyfish swims into turns.
        if (!isDragged && Math.abs(dAngle) > 0.15 && speed > 0.08) {
            const nudge = Math.abs(dAngle) * 0.004;
            blob.cvx += Math.sin(blob.angle) * nudge;
            blob.cvy -= Math.cos(blob.angle) * nudge;
        }

        // Cache trig — used by both rim and tentacle root calculations below
        const cosA = Math.cos(blob.angle);
        const sinA = Math.sin(blob.angle);

        // ── Drain expand: apply KICK_ACCEL fraction of pending expansion each frame ─
        if (blob.expandRemaining > 0.0005) {
            const e = blob.expandRemaining * KICK_ACCEL;
            blob.expandScale += e;
            blob.expandRemaining -= e;
        } else {
            blob.expandRemaining = 0;
        }

        // ── Expand scale decay ────────────────────────────────────────────────
        blob.expandScale *= BLOB_EXPAND_DECAY;
        if (blob.expandScale < 0.001) blob.expandScale = 0;

        // Tentacle spread decay — roots return inward; PBD carries the closing wave to the tips
        blob.tentacleSpreadScale = 1 + (blob.tentacleSpreadScale - 1) * TENTACLE_SPREAD_DECAY;
        if (blob.tentacleSpreadScale < 1.001) blob.tentacleSpreadScale = 1.0;

        // ── Energy recharge ───────────────────────────────────────────────────
        blob.energy = Math.min(blob.energy + ENERGY_RECHARGE, ENERGY_MAX);

        // ── Inflate/deflate: persistent size that accumulates on beats ───────
        // Always decay toward 1.0 (even when disabled, so toggling off deflates smoothly).
        blob.inflateScale = 1 + (blob.inflateScale - 1) * INFLATE_DECAY;
        if (blob.inflateScale < 1.0001) blob.inflateScale = 1.0;

        // ── Idle pulsing: slow sinusoidal bell breath ─────────────────────────
        blob.idlePhase += 0.022;
        const idlePulse  = Math.sin(blob.idlePhase) * 0.045;
        // inflateScale is always applied to bellScale — when disabled no new boosts are added,
        // but the existing inflation deflates smoothly rather than snapping to 1.
        const bellScale  = (1 + idlePulse + blob.expandScale * BLOB_EXPAND_SCALE) * blob.inflateScale;

        // ── Bell rim particles ────────────────────────────────────────────────
        // Each rim particle springs toward its rest position on the scaled dome arc.
        const rimJitter = BLOB_JITTER * 0.35 * (1 + param * 0.5);
        for (const p of blob.rimParticles) {
            // Rotate the rest offset by blob.angle before adding to center
            const srx    = p.rx * bellScale;
            const sry    = p.ry * bellScale;
            const restX  = blob.cx + srx * cosA - sry * sinA;
            const restY  = blob.cy + srx * sinA + sry * cosA;
            p.vx += (restX - p.x) * BLOB_SPRING_K;
            p.vy += (restY - p.y) * BLOB_SPRING_K;
            p.vx += rand(-rimJitter, rimJitter);
            p.vy += rand(-rimJitter, rimJitter);
            p.vx *= BLOB_DAMPING;
            p.vy *= BLOB_DAMPING;
            p.x  += p.vx;
            p.y  += p.vy;
        }

        // ── Tentacle chain — Position-Based Dynamics ─────────────────────────
        //
        // Each particle carries implicit momentum via (pos - prevPos).
        // Water drag is applied by scaling that delta before advancing.
        // An inextensible distance constraint is then projected from root→tip,
        // so movement propagates down the chain with natural, cascading lag
        // rather than every segment rotating rigidly in lockstep.
        //
        // Trailing direction: gentle bias force so tentacles prefer to flow
        // behind the jellyfish, but the constraint — not the force — shapes them.
        const trailDX    = -sinA;   // opposite of head direction
        const trailDY    =  cosA;
        const tentJitter = BLOB_JITTER * 0.6 * (1 + param * 1.2);

        for (let ti = 0; ti < blob.tentacles.length; ti++) {
            const chain   = blob.tentacles[ti];
            const tNorm   = ti / (blob.tentacles.length - 1);
            const rootOff = lerp(-BLOB_REST_RADIUS * 0.88, BLOB_REST_RADIUS * 0.88, tNorm) * bellScale * blob.tentacleSpreadScale;
            const rootX   = blob.cx + rootOff * cosA;
            const rootY   = blob.cy + rootOff * sinA;

            for (let si = 0; si < chain.length; si++) {
                const p = chain[si];

                if (si === 0) {
                    // Root: snap to attachment point each frame.
                    // Store current pos as previous so the root carries no phantom velocity.
                    p.px = p.x;
                    p.py = p.y;
                    p.x  = rootX;
                    p.y  = rootY;
                    continue;
                }

                // Implicit velocity = displacement since last frame, attenuated by water drag
                const ivx = (p.x - p.px) * BLOB_DAMPING;
                const ivy = (p.y - p.py) * BLOB_DAMPING;

                // Advance stored previous position before we move
                p.px = p.x;
                p.py = p.y;

                // Apply velocity + small external forces (trailing bias + residual gravity)
                p.x += ivx
                     + rand(-tentJitter, tentJitter)
                     + trailDX * JELLYFISH_GRAVITY * 0.12;
                p.y += ivy
                     + rand(-tentJitter, tentJitter)
                     + trailDY * JELLYFISH_GRAVITY * 0.12
                     + JELLYFISH_GRAVITY * 0.06;   // tiny real-gravity droop

                // Distance constraint: project p onto the sphere of radius segLen
                // around its parent. This keeps tentacle segments inextensible and
                // propagates the root's movement down the chain with natural lag.
                const par   = chain[si - 1];
                const dx    = p.x - par.x;
                const dy    = p.y - par.y;
                const dist2 = dx * dx + dy * dy;
                if (dist2 < 1e-6) continue;
                const dist  = Math.sqrt(dist2);
                const corr  = (dist - TENTACLE_SEG_LEN) / dist;
                p.x -= dx * corr;
                p.y -= dy * corr;
            }
        }
    }
}

// ─── Clam physics ─────────────────────────────────────────────────────────────
function updateClams() {
    for (const clam of clams) {
        const param = clam.detector ? clam.detector.parameter : 0;
        const isDragged = (clam === draggedClam);

        // Water gravity — pulls clam back down
        clam.cvy += CLAM_GRAVITY;

        // Slow idle bob — sinusoidal vertical drift like floating in water
        clam.idlePhase += 0.016;
        clam.cvy += Math.sin(clam.idlePhase) * 0.007;

        // Water drag (velocity damping in both axes)
        clam.cvx *= CLAM_WATER_DRAG;
        clam.cvy *= CLAM_WATER_DRAG;

        // Spin decay — if Spin Max is zero or below, stop all rotation and drift angle back to upright
        if (CLAM_SPIN_MAX <= 0) {
            clam.spinVel = 0;
            clam.angle  *= 0.95;
        } else {
            clam.spinVel *= CLAM_SPIN_DECAY;
            clam.angle   += clam.spinVel;
        }

        if (isDragged) {
            // Spring pull toward cursor
            clam.cvx += (dragCursorX - clam.cx) * DRAG_SPRING_K;
            clam.cvy += (dragCursorY - clam.cy) * DRAG_SPRING_K;
        } else {
            // Soft edge repulsion
            if (clam.cx < CLAM_MARGIN)                  clam.cvx += 0.04;
            if (clam.cx > canvas.width  - CLAM_MARGIN)  clam.cvx -= 0.04;
            if (clam.cy < TOP_CLEAR + CLAM_MARGIN)       clam.cvy += 0.04;
            if (clam.cy > canvas.height - CLAM_MARGIN)   clam.cvy -= 0.04;
        }

        // Speed cap — raised while dragging so it can keep up with fast cursor movement
        const spd = Math.sqrt(clam.cvx * clam.cvx + clam.cvy * clam.cvy);
        const spdMax = isDragged ? 12 : 10;
        if (spd > spdMax) { clam.cvx *= spdMax / spd; clam.cvy *= spdMax / spd; }

        clam.cx += clam.cvx;
        clam.cy += clam.cvy;
        clam.cx  = Math.max(CLAM_MARGIN, Math.min(canvas.width  - CLAM_MARGIN, clam.cx));
        clam.cy  = Math.max(TOP_CLEAR + CLAM_MARGIN, Math.min(canvas.height - CLAM_MARGIN, clam.cy));

        // Shell opening spring — snaps open, then springs back closed
        clam.openVel   += -CLAM_SNAP_SPRING * clam.openAmount;
        clam.openVel   *= CLAM_SNAP_DAMP;
        clam.openAmount = Math.max(0, clam.openAmount + clam.openVel);

        const cosA = Math.cos(clam.angle);
        const sinA = Math.sin(clam.angle);

        // Particle spring physics — same spring-toward-rest as jellyfish
        // Upper half (halfBit=1) shifts up as openAmount increases; lower shifts down slightly.
        const rimJitter = BLOB_JITTER * 0.22 * (1 + param * 0.5);
        for (const p of clam.particles) {
            const lipShift = p.halfBit === 1
                ? -clam.openAmount * CLAM_LIP_OPEN
                :  clam.openAmount * CLAM_LIP_OPEN * 0.25;
            const localX = p.rx;
            const localY = p.ry + lipShift;
            const restX  = clam.cx + localX * cosA - localY * sinA;
            const restY  = clam.cy + localX * sinA + localY * cosA;
            p.vx += (restX - p.x) * BLOB_SPRING_K;
            p.vy += (restY - p.y) * BLOB_SPRING_K;
            p.vx += rand(-rimJitter, rimJitter);
            p.vy += rand(-rimJitter, rimJitter);
            p.vx *= BLOB_DAMPING;
            p.vy *= BLOB_DAMPING;
            p.x  += p.vx;
            p.y  += p.vy;
        }
    }
}

// ─── Jellyfish beat trigger ───────────────────────────────────────────────────
function triggerBlobBeat(index) {
    const blob = blobs[index];
    if (!blob) return;

    // Queue bell expansion — drained into expandScale at KICK_ACCEL rate each frame
    blob.expandRemaining = 1.0;

    // Tentacle splay — roots fan outward immediately; PBD lag propagates the wave to the tips
    blob.tentacleSpreadScale = TENTACLE_SPREAD_BOOST;

    // Inflate: boost persistent size, capped at INFLATE_MAX
    if (INFLATE_ENABLED) {
        blob.inflateScale = Math.min(blob.inflateScale + INFLATE_BOOST, INFLATE_MAX);
    }

    // Queue forward propulsion — drained into bkx/bky at KICK_ACCEL rate each frame.
    // Jellyfish that trigger infrequently accumulate more energy and lunge further;
    // rapid triggers fire on small charges, naturally self-limiting top speed.
    blob.thrustRemaining = blob.energy * BLOB_BEAT_KICK * (blob.kickScale ?? 1.0);
    blob.energy = 0;

    // Whip tentacles with an impulse that decays toward the tip.
    // In PBD: to add velocity dv, subtract dv from prevPos →
    //   v_new = pos - (prevPos - dv) = (pos - prevPos) + dv  ✓
    //
    // The impulse is expressed in the jellyfish's own coordinate frame so it
    // works correctly regardless of orientation:
    //   headDX/Y  — unit vector pointing toward the apex (used for the whip)
    //   perpDX/Y  — unit vector perpendicular to the head (used for lateral sway)
    const headDX =  Math.sin(blob.angle);   // head direction matches rotation convention
    const headDY = -Math.cos(blob.angle);
    const perpDX =  Math.cos(blob.angle);   // 90° CCW from head
    const perpDY =  Math.sin(blob.angle);

    for (const chain of blob.tentacles) {
        for (let si = 1; si < chain.length; si++) {   // skip root (si=0), it snaps to bell
            const rootBias = 1 - si / chain.length;
            const whip    = rand(3, 7)    * rootBias;
            const lateral = rand(-2.5, 2.5) * rootBias;
            // Subtract from prevPos to inject velocity in that direction
            chain[si].px -= headDX * whip + perpDX * lateral;
            chain[si].py -= headDY * whip + perpDY * lateral;
        }
    }
}

// ─── Clam beat trigger ────────────────────────────────────────────────────────
function triggerClamBeat(ci) {
    const clam = clams[ci];
    if (!clam) return;
    // Snap open: inject a positive openVel (spring will close it)
    clam.openVel += 0.12 + rand(0, 0.04);
    // Upward snap — clam launches itself off the "sea floor"
    clam.cvy -= CLAM_SNAP_FORCE * (clam.kickScale ?? 1.0);
    // Random tilt and spin — suppressed when Spin Max is 0 (upright/stable mode)
    if (CLAM_SPIN_MAX > 0) {
        clam.cvx += rand(-CLAM_SNAP_SPREAD, CLAM_SNAP_SPREAD) * (clam.kickScale ?? 1.0);
        clam.spinVel += (rand(0, 1) < 0.5 ? 1 : -1) * rand(0.008, CLAM_SPIN_MAX);
    }
}

// ─── Spotlight (solo mode) ────────────────────────────────────────────────────

// Called each frame with the actual elapsed ms since last frame.
// Updates per-blob activity signals, solo timers, and spotlight alpha.
function updateSpotlights(dt) {
    // 1. Refresh per-blob activity signal from beat triggers
    for (const blob of blobs.concat(clams)) {
        if (blob.detector?.justTriggered) {
            blob.activitySmooth = 1.0;
        } else {
            blob.activitySmooth *= SOLO_ACTIVITY_DECAY;
        }
    }

    // 2. Find the sole active blob, if any
    let soloBlob = null, activeCount = 0;
    for (const blob of blobs.concat(clams)) {
        if (blob.activitySmooth > SOLO_ACTIVITY_THRESH) {
            activeCount++;
            soloBlob = blob;
        }
    }
    if (activeCount !== 1) soloBlob = null;

    // 3. Accumulate/drain soloMs; smooth spotlightAlpha toward target
    for (const blob of blobs.concat(clams)) {
        if (!SPOTLIGHT_ENABLED) {
            blob.soloMs = 0;
            blob.spotlightAlpha *= (1 - SPOTLIGHT_FADE_OUT);
            continue;
        }
        if (blob === soloBlob) {
            blob.soloMs = Math.min(blob.soloMs + dt, SOLO_THRESHOLD_MS * 2);
        } else {
            blob.soloMs = Math.max(0, blob.soloMs - dt * 3);
        }
        const targetAlpha = blob.soloMs >= SOLO_THRESHOLD_MS ? SPOTLIGHT_MAX_ALPHA : 0;
        const rate = targetAlpha > blob.spotlightAlpha ? SPOTLIGHT_FADE_IN : SPOTLIGHT_FADE_OUT;
        blob.spotlightAlpha += (targetAlpha - blob.spotlightAlpha) * rate;
    }
}

// Draws the spotlight glow behind each eligible blob.
// Must be called after background fill but before drawBlobs.
function drawSpotlights() {
    for (const blob of blobs) {
        if (blob.spotlightAlpha < 0.001) continue;
        const r    = BELL_RADIUS * SPOTLIGHT_RADIUS_MULT;
        const a0   = blob.spotlightAlpha;
        const a1   = (a0 * 0.4).toFixed(4);
        const grad = ctx.createRadialGradient(blob.cx, blob.cy, 0, blob.cx, blob.cy, r);
        grad.addColorStop(0,   `rgba(${blob.colorR},${blob.colorG},${blob.colorB},${a0.toFixed(4)})`);
        grad.addColorStop(0.5, `rgba(${blob.colorR},${blob.colorG},${blob.colorB},${a1})`);
        grad.addColorStop(1,   `rgba(${blob.colorR},${blob.colorG},${blob.colorB},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(blob.cx, blob.cy, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ─── Duo Link ─────────────────────────────────────────────────────────────────

// Each particle owns a fixed position t ∈ [0,1] along the bA→bB axis plus a
// fixed perpendicular offset. Its home point each frame is
//   bA + t*(bB-bA) + perpAmt * perpVec
// so the web reshapes naturally as the blobs move.
// colorT = t gives an exact position-based color gradient from bA to bB.
// Density is biased toward the blob ends (35% each) with 30% in the middle,
// and the perpendicular spread envelope narrows toward the midpoint so the
// web thins slightly there.
function _createDuoParticles(bA, bB) {
    const particles  = [];
    const total      = DUO_LINK_PARTICLE_COUNT;
    const nearCount  = Math.floor(total * 0.35);   // 35% near each blob
    const midCount   = total - nearCount * 2;       // remainder in the middle

    // Axis + perpendicular unit vectors at creation time (re-derived each frame in update).
    const axLen = Math.hypot(bB.cx - bA.cx, bB.cy - bA.cy) || 1;
    const ax = (bB.cx - bA.cx) / axLen, ay = (bB.cy - bA.cy) / axLen;
    const perpX = -ay, perpY = ax;

    function mkParticle(t) {
        // Perpendicular spread profile: widest at the blob ends, narrows toward the midpoint.
        // sin(π·t) peaks at t=0.5 → (1−sin) is 1 at ends and 0 at centre.
        const profile = 1 - Math.sin(Math.PI * t);
        const maxPerp = DUO_LINK_SPREAD * BELL_RADIUS * (0.42 + 0.58 * profile);
        const perpAmt = rand(-maxPerp, maxPerp);
        const wx = bA.cx + t * (bB.cx - bA.cx) + perpAmt * perpX;
        const wy = bA.cy + t * (bB.cy - bA.cy) + perpAmt * perpY;
        return { x: wx, y: wy, vx: 0, vy: 0, t, perpAmt, colorT: t, _prox: 0 };
    }

    for (let i = 0; i < nearCount; i++) particles.push(mkParticle(rand(0,    0.35)));
    for (let i = 0; i < nearCount; i++) particles.push(mkParticle(rand(0.65, 1.0)));
    for (let i = 0; i < midCount;  i++) particles.push(mkParticle(rand(0.25, 0.75)));
    return particles;
}

// Each frame, re-derive the axis so the web reshapes as blobs move.
// Each particle springs toward its fixed (t, perpAmt) home on the current axis.
// Spring stiffness is slightly weaker at the midpoint so central particles
// drift more freely, reinforcing the sparse, hazy middle appearance.
function _updateDuoParticles(pair) {
    const bA = pair.blobA, bB = pair.blobB;
    const axLen = Math.hypot(bB.cx - bA.cx, bB.cy - bA.cy);
    if (axLen < 1) return;
    const ax = (bB.cx - bA.cx) / axLen, ay = (bB.cy - bA.cy) / axLen;
    const perpX = -ay, perpY = ax;
    for (const p of pair.particles) {
        // Home point tracks the live blob positions
        const homeX = bA.cx + p.t * (bB.cx - bA.cx) + p.perpAmt * perpX;
        const homeY = bA.cy + p.t * (bB.cy - bA.cy) + p.perpAmt * perpY;
        // Stiffness is weaker near t=0.5 — middle particles float more loosely
        const mid     = 1 - Math.abs(p.t * 2 - 1);   // 0 at ends, 1 at centre
        const springK = 0.0026 - 0.0012 * mid;
        p.vx += (homeX - p.x) * springK + rand(-0.18, 0.18);
        p.vy += (homeY - p.y) * springK + rand(-0.18, 0.18);
        p.vx *= 0.93;
        p.vy *= 0.93;
        p.x  += p.vx;
        p.y  += p.vy;
    }
}

// Called each frame after updateSpotlights (which has already refreshed activitySmooth).
function updateDuoLinks(dt) {
    // ── Sync detection: find the best-scoring eligible pair ──────────────────
    // Sync detection: for each candidate pair, count how many of A's recent triggers
    // land within ±DUO_SYNC_TOLERANCE ms of any of B's triggers (and symmetrically).
    // A pair is eligible when BOTH directional match counts reach DUO_SYNC_MIN_MATCHES.
    // The best eligible pair (highest minimum match count) wins.
    const now    = performance.now();
    const cutoff = now - DUO_SYNC_WINDOW * 1000;
    const allC   = blobs.concat(clams);

    // Prune old entries once per frame for every creature
    for (const c of allC) {
        let i = 0;
        while (i < c.triggerTimes.length && c.triggerTimes[i] < cutoff) i++;
        if (i > 0) c.triggerTimes.splice(0, i);
    }

    // Count how many of `src` triggers are within tolerance of any `dst` trigger
    function _matchCount(src, dst) {
        let n = 0;
        for (const tS of src) {
            for (const tD of dst) {
                if (Math.abs(tS - tD) <= DUO_SYNC_TOLERANCE) { n++; break; }
            }
        }
        return n;
    }

    let bA = null, bB = null, bestScore = -1;
    for (let i = 0; i < allC.length; i++) {
        const tA = allC[i].triggerTimes;
        if (tA.length < DUO_SYNC_MIN_MATCHES) continue;
        for (let j = i + 1; j < allC.length; j++) {
            const tB = allC[j].triggerTimes;
            if (tB.length < DUO_SYNC_MIN_MATCHES) continue;
            // Both directions must reach the threshold
            const mAB = _matchCount(tA, tB);
            if (mAB < DUO_SYNC_MIN_MATCHES) continue;
            const mBA = _matchCount(tB, tA);
            if (mBA < DUO_SYNC_MIN_MATCHES) continue;
            const score = Math.min(mAB, mBA);
            if (score > bestScore) { bestScore = score; bA = allC[i]; bB = allC[j]; }
        }
    }
    const isDuo = bA !== null;

    // Invalidate a stale pair (a member blob removed from the scene).
    if (_duoPair && (!allC.includes(_duoPair.blobA) || !allC.includes(_duoPair.blobB))) {
        _duoPair = null;
    }

    // Create a new pair when conditions are met and none exists yet.
    if (!_duoPair && isDuo && DUO_LINK_ENABLED) {
        _duoPair = { blobA: bA, blobB: bB, duoMs: 0, linkAlpha: 0,
                     particles: _createDuoParticles(bA, bB) };
    }
    if (!_duoPair) return;

    const pair      = _duoPair;
    const pairMatch = isDuo && ((pair.blobA === bA && pair.blobB === bB) ||
                                (pair.blobA === bB && pair.blobB === bA));

    if (DUO_LINK_ENABLED && pairMatch) {
        pair.duoMs = Math.min(pair.duoMs + dt, DUO_THRESHOLD_MS * 2);
    } else {
        pair.duoMs = Math.max(0, pair.duoMs - dt * 3);
    }

    const targetAlpha = (DUO_LINK_ENABLED && pair.duoMs >= DUO_THRESHOLD_MS) ? DUO_LINK_MAX_ALPHA : 0;
    const rate = targetAlpha > pair.linkAlpha ? DUO_FADE_IN : DUO_FADE_OUT;
    pair.linkAlpha += (targetAlpha - pair.linkAlpha) * rate;

    // Once fully faded and drained, release the pair so a new one can form.
    if (pair.linkAlpha < 0.001 && pair.duoMs <= 0) _duoPair = null;

    // Move particles (only while visible to avoid pointless computation).
    if (_duoPair && pair.linkAlpha > 0.001) _updateDuoParticles(pair);
}

// Draw the duo-link particle web.
// Edge colour blends between the two blob colours by avg particle colorT.
// Edge brightness is highest near each blob, fading toward the midpoint.
function drawDuoLinks() {
    if (!_duoPair || _duoPair.linkAlpha < 0.001) return;
    const pair = _duoPair;
    const bA = pair.blobA, bB = pair.blobB;
    const _ac = blobs.concat(clams);
    if (!_ac.includes(bA) || !_ac.includes(bB)) return;

    const { particles, linkAlpha } = pair;
    const edgeDist   = DUO_LINK_EDGE_DIST;
    const edgeDistSq = edgeDist * edgeDist;

    // Per-particle blob-proximity weight — drives the alpha tier, making edges
    // near each blob glow brighter (mirrors how the bell web brightens near nodes).
    const proxRange = BELL_RADIUS * 1.5 + edgeDist;
    for (const p of particles) {
        const dA = Math.hypot(p.x - bA.cx, p.y - bA.cy);
        const dB = Math.hypot(p.x - bB.cx, p.y - bB.cy);
        p._prox = Math.max(0, 1 - Math.min(dA, dB) / proxRange);
    }

    // Bucket edges: 5 colour bands × 3 alpha tiers.
    // Combined alpha key = edgeProximity × blobProximity so only close edges near
    // a blob reach the top tier; sparse mid-field edges stay in lower tiers.
    const NC = 5, NA = 3;
    const buckets = Array.from({ length: NC }, () => [[], [], []]);
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[j].x - particles[i].x;
            const dy = particles[j].y - particles[i].y;
            const d2 = dx * dx + dy * dy;
            if (d2 > edgeDistSq) continue;
            const tProx  = 1 - Math.sqrt(d2) / edgeDist;
            const prox   = (particles[i]._prox + particles[j]._prox) * 0.5;
            const tColor = (particles[i].colorT + particles[j].colorT) * 0.5;
            const ci     = Math.min(NC - 1, tColor * NC | 0);
            const ai     = Math.min(NA - 1, tProx * prox * NA | 0);
            buckets[ci][ai].push(i, j);
        }
    }

    ctx.lineWidth = 0.65;
    for (let ci = 0; ci < NC; ci++) {
        const t = (ci + 0.5) / NC;
        const r = (bA.colorR + (bB.colorR - bA.colorR) * t) | 0;
        const g = (bA.colorG + (bB.colorG - bA.colorG) * t) | 0;
        const b = (bA.colorB + (bB.colorB - bA.colorB) * t) | 0;
        for (let ai = 0; ai < NA; ai++) {
            const bucket = buckets[ci][ai];
            if (!bucket.length) continue;
            const alpha = linkAlpha * (ai + 1) / NA;
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha.toFixed(4)})`;
            ctx.beginPath();
            for (let k = 0; k < bucket.length; k += 2) {
                const pi = particles[bucket[k]], pj = particles[bucket[k + 1]];
                ctx.moveTo(pi.x, pi.y);
                ctx.lineTo(pj.x, pj.y);
            }
            ctx.stroke();
        }
    }
}

// ─── Draw jellyfish ───────────────────────────────────────────────────────────

// Smooth quadratic-bezier path through an array of {x,y} points (no closing).
function _smoothPath(pts) {
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 0; i < pts.length - 1; i++) {
        const mx = (pts[i].x + pts[i + 1].x) * 0.5;
        const my = (pts[i].y + pts[i + 1].y) * 0.5;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
}

function drawBlobs() {
    ctx.lineCap = 'round';

    for (const blob of blobs) {
        const param = blob.detector ? blob.detector.parameter : 0;
        const { rimParticles, rimOnly, tentacles, cx, cy, colorR, colorG, colorB } = blob;
        if (rimParticles.length < 3) continue;

        // apex = topmost rim particle (the midpoint of the semicircle arc)
        const apex = rimOnly[Math.floor(rimOnly.length / 2)];

        // ── 1. Tentacles (drawn first — behind the bell) ──────────────────────
        for (const chain of tentacles) {
            if (chain.length < 2) continue;
            const root = chain[0];
            const tip  = chain[chain.length - 1];

            // Gradient fades from base (semi-opaque) to tip (transparent)
            // sp: 0 at rest, peaks ~0.4 at full splay — drives extra thickness and glow
            const sp   = blob.tentacleSpreadScale - 1.0;
            const grad = ctx.createLinearGradient(root.x, root.y, tip.x, tip.y);
            const a0   = 0.40 + param * 0.25 + sp * 0.35;
            grad.addColorStop(0,    `rgba(${colorR},${colorG},${colorB},${a0})`);
            grad.addColorStop(0.55, `rgba(${colorR},${colorG},${colorB},${a0 * 0.38})`);
            grad.addColorStop(1,    `rgba(${colorR},${colorG},${colorB},0)`);

            ctx.beginPath();
            _smoothPath(chain);
            ctx.strokeStyle = grad;
            ctx.lineWidth   = 1.0 + param * 0.8 + sp * 2.5;
            ctx.shadowColor = `rgba(${colorR},${colorG},${colorB},${0.25 + sp * 0.4})`;
            ctx.shadowBlur  = 4 + param * 8 + sp * 14;
            ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // Control point for the convex closing edge — pushed outward from bell center
        // so both the fill and stroke share the same slight outward bow
        const _roFirst = rimOnly[0], _roLast = rimOnly[rimOnly.length - 1];
        const _rimMidX = (_roFirst.x + _roLast.x) / 2;
        const _rimMidY = (_roFirst.y + _roLast.y) / 2;
        const _rimOdx  = _rimMidX - cx,  _rimOdy = _rimMidY - cy;
        const _rimOlen = Math.sqrt(_rimOdx * _rimOdx + _rimOdy * _rimOdy) || 1;
        const _rimCpx  = _rimMidX + (_rimOdx / _rimOlen) * BELL_RADIUS * 0.2;
        const _rimCpy  = _rimMidY + (_rimOdy / _rimOlen) * BELL_RADIUS * 0.2;

        // ── 2. Faint hull fill using rim outline ──────────────────────────────
        ctx.beginPath();
        _smoothPath(rimOnly);
        ctx.quadraticCurveTo(_rimCpx, _rimCpy, _roFirst.x, _roFirst.y);
        ctx.closePath();
        const fill = ctx.createRadialGradient(apex.x, apex.y, 0, cx, cy, BELL_RADIUS * 1.1);
        fill.addColorStop(0,   `rgba(${colorR},${colorG},${colorB},${0.13 + param * 0.10})`);
        fill.addColorStop(0.6, `rgba(${colorR},${colorG},${colorB},${0.05 + param * 0.04})`);
        fill.addColorStop(1,   `rgba(${colorR},${colorG},${colorB},0.01)`);
        ctx.fillStyle = fill;
        ctx.fill();

        // ── 3. Web edges between all bell particles ───────────────────────────
        // BLOB_EDGE_DIST (slider) controls connection radius.
        // Edges are bucketed into 4 alpha tiers and batch-stroked to minimise GPU state changes.
        const webDist   = BLOB_EDGE_DIST;
        const webDistSq = webDist * webDist;
        const webAlpha0 = 0.07 + param * 0.22;
        ctx.lineWidth = 0.7;
        {
            const buckets = [[], [], [], []];
            for (let i = 0; i < rimParticles.length; i++) {
                for (let j = i + 1; j < rimParticles.length; j++) {
                    const dx     = rimParticles[j].x - rimParticles[i].x;
                    const dy     = rimParticles[j].y - rimParticles[i].y;
                    const distSq = dx * dx + dy * dy;
                    if (distSq > webDistSq) continue;
                    const t = 1 - Math.sqrt(distSq) / webDist;
                    buckets[Math.min(3, t * 4 | 0)].push(i, j);
                }
            }
            for (let b = 0; b < 4; b++) {
                if (!buckets[b].length) continue;
                const a = webAlpha0 * ((b + 0.5) / 4);
                ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},${a})`;
                ctx.beginPath();
                for (let k = 0; k < buckets[b].length; k += 2) {
                    const pi = rimParticles[buckets[b][k]], pj = rimParticles[buckets[b][k + 1]];
                    ctx.moveTo(pi.x, pi.y);
                    ctx.lineTo(pj.x, pj.y);
                }
                ctx.stroke();
            }
        }

        // ── 4. Outer rim glow stroke ──────────────────────────────────────────
        ctx.beginPath();
        _smoothPath(rimOnly);
        ctx.quadraticCurveTo(_rimCpx, _rimCpy, _roFirst.x, _roFirst.y);
        ctx.shadowColor = `rgba(${colorR},${colorG},${colorB},0.75)`;
        ctx.shadowBlur  = 8 + param * 14;
        ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},${0.45 + param * 0.28})`;
        ctx.lineWidth   = 1.4;
        ctx.stroke();
        ctx.shadowBlur  = 0;

        // ── 5. Particle dots — rim larger/brighter, interior smaller ──────────
        ctx.shadowColor = `rgba(${colorR},${colorG},${colorB},0.85)`;
        ctx.shadowBlur  = 4 + param * 9;
        for (const p of rimParticles) {
            const r = p.rim ? NODE_BASE_RADIUS * 0.70 : NODE_BASE_RADIUS * 0.48;
            const a = p.rim ? (0.75 + param * 0.20) : (0.48 + param * 0.30);
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${colorR},${colorG},${colorB},${a})`;
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }
}

// ─── Draw clams ───────────────────────────────────────────────────────────────
function drawClams() {
    ctx.lineCap = 'round';

    for (const clam of clams) {
        if (clam.particles.length < 3) continue;
        const param = clam.detector ? clam.detector.parameter : 0;
        const { particles, upperRim, lowerRim, cx, cy, colorR, colorG, colorB } = clam;

        // ── 1. Upper shell fill ───────────────────────────────────────────────
        const apexU = upperRim[Math.floor(upperRim.length / 2)];
        ctx.beginPath();
        _smoothPath(upperRim);
        ctx.lineTo(upperRim[0].x, upperRim[0].y);
        const fillU = ctx.createRadialGradient(apexU.x, apexU.y, 0, cx, cy, CLAM_SHELL_W * 1.15);
        fillU.addColorStop(0,    `rgba(${colorR},${colorG},${colorB},${(0.12 + param * 0.08).toFixed(3)})`);
        fillU.addColorStop(0.65, `rgba(${colorR},${colorG},${colorB},${(0.05 + param * 0.03).toFixed(3)})`);
        fillU.addColorStop(1,    `rgba(${colorR},${colorG},${colorB},0.01)`);
        ctx.fillStyle = fillU;
        ctx.fill();

        // ── 2. Lower shell fill ───────────────────────────────────────────────
        const apexL = lowerRim[Math.floor(lowerRim.length / 2)];
        ctx.beginPath();
        _smoothPath(lowerRim);
        ctx.lineTo(lowerRim[0].x, lowerRim[0].y);
        const fillL = ctx.createRadialGradient(apexL.x, apexL.y, 0, cx, cy, CLAM_SHELL_W * 1.15);
        fillL.addColorStop(0,    `rgba(${colorR},${colorG},${colorB},${(0.10 + param * 0.06).toFixed(3)})`);
        fillL.addColorStop(0.65, `rgba(${colorR},${colorG},${colorB},${(0.04 + param * 0.03).toFixed(3)})`);
        fillL.addColorStop(1,    `rgba(${colorR},${colorG},${colorB},0.01)`);
        ctx.fillStyle = fillL;
        ctx.fill();

        // ── 3. Particle web edges (same bucket system as jellyfish bell) ──────
        const webDist   = CLAM_EDGE_DIST;
        const webDistSq = webDist * webDist;
        const webAlpha0 = 0.07 + param * 0.22;
        ctx.lineWidth = 0.7;
        {
            const buckets = [[], [], [], []];
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[j].x - particles[i].x;
                    const dy = particles[j].y - particles[i].y;
                    const dSq = dx * dx + dy * dy;
                    if (dSq > webDistSq) continue;
                    const t = 1 - Math.sqrt(dSq) / webDist;
                    buckets[Math.min(3, t * 4 | 0)].push(i, j);
                }
            }
            for (let b = 0; b < 4; b++) {
                if (!buckets[b].length) continue;
                const a = webAlpha0 * ((b + 0.5) / 4);
                ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},${a})`;
                ctx.beginPath();
                for (let k = 0; k < buckets[b].length; k += 2) {
                    const pi = particles[buckets[b][k]], pj = particles[buckets[b][k + 1]];
                    ctx.moveTo(pi.x, pi.y);
                    ctx.lineTo(pj.x, pj.y);
                }
                ctx.stroke();
            }
        }

        // ── 4. Rim glow — upper arc ───────────────────────────────────────────
        ctx.beginPath();
        _smoothPath(upperRim);
        ctx.shadowColor = `rgba(${colorR},${colorG},${colorB},0.70)`;
        ctx.shadowBlur  = 7 + param * 12;
        ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},${(0.42 + param * 0.26).toFixed(3)})`;
        ctx.lineWidth   = 1.3;
        ctx.stroke();

        // ── 5. Rim glow — lower arc ───────────────────────────────────────────
        ctx.beginPath();
        _smoothPath(lowerRim);
        ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},${(0.30 + param * 0.18).toFixed(3)})`;
        ctx.lineWidth   = 1.1;
        ctx.stroke();
        ctx.shadowBlur  = 0;

        // ── 6. Lip gap line (the opening between the two shells) ──────────────
        // Connects the left and right lip endpoints; fades in as the clam opens.
        if (clam.openAmount > 0.01) {
            const lipAlpha = Math.min(0.35, clam.openAmount * 0.6);
            const uL = upperRim[upperRim.length - 1];  // upper left lip
            const uR = upperRim[0];                    // upper right lip
            const lR = lowerRim[0];                    // lower right lip
            const lL = lowerRim[lowerRim.length - 1];  // lower left lip
            ctx.beginPath();
            ctx.moveTo(uR.x, uR.y); ctx.lineTo(lR.x, lR.y);
            ctx.moveTo(uL.x, uL.y); ctx.lineTo(lL.x, lL.y);
            ctx.strokeStyle = `rgba(${colorR},${colorG},${colorB},${lipAlpha.toFixed(3)})`;
            ctx.lineWidth   = 0.8;
            ctx.stroke();
        }

        // ── 7. Particle dots ─────────────────────────────────────────────────
        ctx.shadowColor = `rgba(${colorR},${colorG},${colorB},0.85)`;
        ctx.shadowBlur  = 3 + param * 8;
        for (const p of particles) {
            const r = p.rim ? 1.9 * 0.68 : 1.9 * 0.44;
            const a = p.rim ? (0.70 + param * 0.20) : (0.44 + param * 0.28);
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${colorR},${colorG},${colorB},${a})`;
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }
}

// ─── Spawn helpers ────────────────────────────────────────────────────────────
function spawnShockwave(blob) {
    if (!blob) return;
    shockwaves.push({
        x: blob.cx, y: blob.cy,
        radius: 0, maxRadius: SHOCKWAVE_MAX_R,
        life: 60, maxLife: 60,
        color: blob.effectColor,
        er: blob.effectR, eg: blob.effectG, eb: blob.effectB,
        speed: SHOCKWAVE_SPEED * blob.effectSpeed,
    });
}

function spawnPolygon(blob) {
    if (!blob) return;
    polygonFlashes.push({
        progress: 0,
        sides:    randInt(5, 8),
        rotation: rand(0, Math.PI * 2),
        opacity:  0.9,
        cx: blob.cx, cy: blob.cy,
        color: blob.effectColor,
        er: blob.effectR, eg: blob.effectG, eb: blob.effectB,
        speed: POLYGON_EXPAND_RATE * blob.effectSpeed,
    });
}

function spawnSparks(blob) {
    if (!blob) return;
    const src = blob.rimParticles;
    if (!src || !src.length) return;
    const p     = src[randInt(0, src.length - 1)];
    const count = randInt(15, 25);
    for (let i = 0; i < count; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(1.5, 4.5) * blob.effectSpeed;
        sparks.push({
            x: p.x, y: p.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: rand(18, 36), maxLife: 36,
            color: blob.effectColor,
            er: blob.effectR, eg: blob.effectG, eb: blob.effectB,
        });
    }
}

function triggerBlobEffect(blob) {
    switch (blob.effect) {
        case 'shockwave': spawnShockwave(blob); break;
        case 'polygon':   spawnPolygon(blob);   break;
        case 'sparks':    spawnSparks(blob);    break;
    }
}

// ─── Draw effects ─────────────────────────────────────────────────────────────
function drawShockwaves() {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += sw.speed;
        sw.life--;
        if (sw.life <= 0 || sw.radius > sw.maxRadius) { shockwaves.splice(i, 1); continue; }

        const alpha     = (sw.life / sw.maxLife) * 0.7;
        const lineWidth = 1.5 + (1 - sw.radius / sw.maxRadius) * 2.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${sw.er},${sw.eg},${sw.eb},${alpha})`;
        ctx.lineWidth   = lineWidth;
        ctx.shadowColor = `rgba(${sw.er},${sw.eg},${sw.eb},0.6)`;
        ctx.shadowBlur  = 8;
        ctx.stroke();
        ctx.shadowBlur  = 0;
    }
}

function drawPolygonFlashes() {
    for (let i = polygonFlashes.length - 1; i >= 0; i--) {
        const pf = polygonFlashes[i];
        const scale = pf.progress;
        pf.progress += pf.speed;
        if (pf.progress > POLYGON_MAX_SCALE) { polygonFlashes.splice(i, 1); continue; }

        const t       = pf.progress / POLYGON_MAX_SCALE;
        const opacity = pf.opacity * (1 - t);
        ctx.beginPath();
        for (let j = 0; j <= pf.sides; j++) {
            const angle = pf.rotation + (j / pf.sides) * Math.PI * 2;
            const px    = pf.cx + Math.cos(angle) * scale;
            const py    = pf.cy + Math.sin(angle) * scale;
            if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = `rgba(${pf.er},${pf.eg},${pf.eb},${opacity})`;
        ctx.lineWidth   = 2;
        ctx.shadowColor = `rgba(${pf.er},${pf.eg},${pf.eb},${opacity * 0.8})`;
        ctx.shadowBlur  = 12;
        ctx.stroke();
        ctx.shadowBlur  = 0;
    }
}

function drawSparks() {
    for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy;
        s.vx *= 0.94; s.vy *= 0.94;
        s.life--;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }

        const alpha = s.life / s.maxLife;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.5 * alpha + 0.5, 0, Math.PI * 2);
        ctx.fillStyle   = `rgba(${s.er},${s.eg},${s.eb},${alpha})`;
        ctx.shadowColor = `rgba(${s.er},${s.eg},${s.eb},${alpha * 0.6})`;
        ctx.shadowBlur  = 6;
        ctx.fill();
        ctx.shadowBlur  = 0;
    }
}

// ─── Live audio mode ──────────────────────────────────────────────────────────
function ensureDetectors() {
    for (const blob of blobs) {
        if (!blob.detector) {
            blob.detector = new BeatDetector({
                targetHz:        blob.detectorHz,
                rangeHz:         blob.detectorRangeHz,
                octaves:         blob.detectorOctaves,
                triggerDuration: blob.detectorDuration,
                name:            blob.name,
            });
        }
    }
    if (!subD) {
        subD = new BeatDetector({ targetHz: 150, rangeHz: 30, octaves: 2, triggerDuration: 16, name: 'Sub' });
    }
    if (!_flashDetector) {
        const p = _flashHzParams(BLOB_FLASH_HZ);
        _flashDetector = new BeatDetector({ targetHz: BLOB_FLASH_HZ, rangeHz: p.rangeHz, octaves: p.octaves, triggerDuration: p.duration, name: 'Flash' });
        _flashDetector.idleDecayRate = IDLE_DECAY_RATE; _flashDetector.freqDecayBias = FREQ_DECAY_BIAS; _flashDetector.minFluxFloor = MIN_FLUX_FLOOR;
    }
    if (!_particleTrigDetector) {
        const p = _flashHzParams(PARTICLE_TRIGGER_HZ);
        _particleTrigDetector = new BeatDetector({ targetHz: PARTICLE_TRIGGER_HZ, rangeHz: p.rangeHz, octaves: p.octaves, triggerDuration: p.duration, name: 'PrtTrig' });
        _particleTrigDetector.idleDecayRate = IDLE_DECAY_RATE; _particleTrigDetector.freqDecayBias = FREQ_DECAY_BIAS; _particleTrigDetector.minFluxFloor = MIN_FLUX_FLOOR;
    }
    for (const clam of clams) {
        if (!clam.detector) {
            clam.detector = new BeatDetector({
                targetHz:        clam.detectorHz,
                rangeHz:         clam.detectorRangeHz,
                octaves:         clam.detectorOctaves,
                triggerDuration: clam.detectorDuration,
                name:            clam.name,
            });
        }
    }
    // Sync runtime-adjustable threshold parameters to all detectors
    for (const b of blobs) if (b.detector) { b.detector.idleDecayRate = IDLE_DECAY_RATE; b.detector.freqDecayBias = FREQ_DECAY_BIAS; b.detector.minFluxFloor = MIN_FLUX_FLOOR; }
    for (const c of clams) if (c.detector) { c.detector.idleDecayRate = IDLE_DECAY_RATE; c.detector.freqDecayBias = FREQ_DECAY_BIAS; c.detector.minFluxFloor = MIN_FLUX_FLOOR; }
    if (subD) { subD.idleDecayRate = IDLE_DECAY_RATE; subD.freqDecayBias = FREQ_DECAY_BIAS; subD.minFluxFloor = MIN_FLUX_FLOOR; }
    if (_flashDetector) { _flashDetector.idleDecayRate = IDLE_DECAY_RATE; _flashDetector.freqDecayBias = FREQ_DECAY_BIAS; _flashDetector.minFluxFloor = MIN_FLUX_FLOOR; }
    if (_particleTrigDetector) { _particleTrigDetector.idleDecayRate = IDLE_DECAY_RATE; _particleTrigDetector.freqDecayBias = FREQ_DECAY_BIAS; _particleTrigDetector.minFluxFloor = MIN_FLUX_FLOOR; }
    initDetectorGraphs();
}

async function startLiveMode() {
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
            audio: true,
            video: { frameRate: { ideal: 1 } }   // video required by Chrome; stopped immediately
        });

        // Drop the video track — we only want audio
        stream.getVideoTracks().forEach(t => t.stop());

        const audioTracks = stream.getAudioTracks();
        if (!audioTracks.length) {
            statusEl.textContent = 'No audio track — enable "Share system audio"';
            stream.getTracks().forEach(t => t.stop());
            return;
        }

        // Build the live audio graph
        liveStream   = stream;
        liveContext  = new AudioContext();
        liveAnalyser = liveContext.createAnalyser();
        liveAnalyser.fftSize = 2048;
        liveFreqData = new Float32Array(liveAnalyser.frequencyBinCount);

        // Connect source → analyser (NOT to destination — avoids echo)
        liveContext.createMediaStreamSource(stream).connect(liveAnalyser);

        // Ensure detectors exist, then reset them all (clear stale flux history)
        ensureDetectors();
        for (const blob of blobs) if (blob.detector) blob.detector.reset();
        for (const clam of clams) if (clam.detector) clam.detector.reset();
        if (subD) subD.reset();
        if (_flashDetector) _flashDetector.reset();
        if (_particleTrigDetector) _particleTrigDetector.reset();

        // Pause file audio if it was playing
        if (audio && playing) {
            audio.pause();
            playing = false;
            playBtn.textContent = 'Play';
        }

        eqByteData = null;   // reallocate with correct size from new analyser

        liveMode = true;
        liveModeBtn.textContent = '📁 File';
        liveModeBtn.classList.add('active');
        statusEl.textContent = 'Live';

        // Auto-stop when user ends screen share
        audioTracks[0].addEventListener('ended', stopLiveMode);

    } catch (err) {
        if (err.name !== 'AbortError' && err.name !== 'NotAllowedError') {
            statusEl.textContent = 'Live audio unavailable';
        }
        // User cancelled dialog — silently ignore
    }
}

function stopLiveMode() {
    if (liveStream)  { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
    if (liveContext) { liveContext.close(); liveContext = null; }
    liveAnalyser = null;
    liveFreqData = null;
    eqByteData   = null;   // reallocate with correct size on return to file mode
    for (const blob of blobs) if (blob.detector) blob.detector.reset();
    if (subD) subD.reset();
    if (_flashDetector) _flashDetector.reset();
    if (_particleTrigDetector) _particleTrigDetector.reset();
    liveMode = false;
    liveModeBtn.textContent = '🎤 Live';
    liveModeBtn.classList.remove('active');
    statusEl.textContent = playing ? 'Playing' : 'Idle';
}

liveModeBtn.addEventListener('click', () => {
    if (liveMode) stopLiveMode(); else startLiveMode();
});
