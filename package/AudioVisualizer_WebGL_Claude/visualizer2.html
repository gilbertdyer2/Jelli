async function loadFileList() {
    let files = PROVIDED_FILES;
    try {
        const res = await fetch('audioFileList.json');
        if (res.ok) files = await res.json();
    } catch (_) { /* use fallback */ }

    while (fileSelect.options.length > 1) fileSelect.remove(1);
    for (const f of files) {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f.replace('AudioFiles/', '');
        fileSelect.appendChild(opt);
    }
    if (files.length > 0) fileSelect.value = files[0];
}

function setupAudio() {
    const src = fileSelect.value;
    if (!src) { statusEl.textContent = 'No file selected'; return; }

    if (!audio) {
        audio = new Audio();
        audio.loop = true;
        audio.addEventListener('seeked', () => { if (manager) manager.reset(); });
    }

    if (!manager) {
        audio.src = src;
        manager = new BeatDetectorManager(audio, { fftSize: 2048 });
        manager.init();

        // Create per-blob detectors (standalone, not registered with manager)
        for (const blob of blobs) {
            if (!blob.detector) {
                blob.detector = new BeatDetector({
                    targetHz:        blob.detectorHz,
                    rangeHz:         blob.detectorRangeHz,
                    octaves:         blob.detectorOctaves,
                    triggerDuration: blob.detectorDuration,
                    name:            blob.name,
                });
            }
        }
        // Clam detectors
        for (const clam of clams) {
            if (!clam.detector) {
                clam.detector = new BeatDetector({
                    targetHz:        clam.detectorHz,
                    rangeHz:         clam.detectorRangeHz,
                    octaves:         clam.detectorOctaves,
                    triggerDuration: clam.detectorDuration,
                    name:            clam.name,
                });
            }
        }
        // Background wash detector (no blob)
        if (!subD) {
            subD = new BeatDetector({ targetHz: 150, rangeHz: 30, octaves: 2, triggerDuration: 16, name: 'Sub' });
        }
        if (!_flashDetector) {
            const p = _flashHzParams(BLOB_FLASH_HZ);
            _flashDetector = new BeatDetector({ targetHz: BLOB_FLASH_HZ, rangeHz: p.rangeHz, octaves: p.octaves, triggerDuration: p.duration, name: 'Flash' });
            _flashDetector.idleDecayRate = IDLE_DECAY_RATE; _flashDetector.freqDecayBias = FREQ_DECAY_BIAS; _flashDetector.minFluxFloor = MIN_FLUX_FLOOR;
        }
        if (!_particleTrigDetector) {
            const p = _flashHzParams(PARTICLE_TRIGGER_HZ);
            _particleTrigDetector = new BeatDetector({ targetHz: PARTICLE_TRIGGER_HZ, rangeHz: p.rangeHz, octaves: p.octaves, triggerDuration: p.duration, name: 'PrtTrig' });
            _particleTrigDetector.idleDecayRate = IDLE_DECAY_RATE; _particleTrigDetector.freqDecayBias = FREQ_DECAY_BIAS; _particleTrigDetector.minFluxFloor = MIN_FLUX_FLOOR;
        }

        audio.addEventListener('canplay', () => {
            audio.play(); playing = true;
            playBtn.textContent = 'Pause'; statusEl.textContent = 'Playing';
        });
        audio.addEventListener('ended', () => {
            playing = false; playBtn.textContent = 'Play'; statusEl.textContent = 'Ended';
        });
        audio.load();
    } else {
        audio.pause();
        audio.src = src;
        manager.reset();
        audio.load();
        audio.addEventListener('canplay', () => {
            audio.play(); playing = true;
            playBtn.textContent = 'Pause'; statusEl.textContent = 'Playing';
        }, { once: true });
    }
}

// ─── Playback / scrub bar ─────────────────────────────────────────────────────
function seekToFraction(frac) {
    if (!audio || !isFinite(audio.duration) || audio.duration === 0) return;
    audio.currentTime = frac * audio.duration;
    const pctStr = `${(frac * 100).toFixed(3)}%`;
    scrubFill.style.width   = pctStr;
    scrubThumb.style.left   = pctStr;
    timeCurrent.textContent = formatTime(audio.currentTime);
}

function scrubFractionFromEvent(e) {
    const rect = scrubTrack.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
}

scrubTrack.addEventListener('mousedown', e => {
    e.preventDefault();
    isScrubbing = true;
    scrubTrack.classList.add('is-scrubbing');
    seekToFraction(scrubFractionFromEvent(e));
});

document.addEventListener('mousemove', e => {
    if (!isScrubbing) return;
    seekToFraction(scrubFractionFromEvent(e));
});

document.addEventListener('mouseup', () => {
    if (!isScrubbing) return;
    isScrubbing = false;
    scrubTrack.classList.remove('is-scrubbing');
});

function updatePlaybackBar() {
    if (!audio || !isFinite(audio.duration)) return;
    if (isScrubbing) return;
    const dur    = audio.duration;
    const cur    = audio.currentTime;
    const pct    = dur > 0 ? cur / dur : 0;
    const pctStr = `${(pct * 100).toFixed(3)}%`;
    scrubFill.style.width   = pctStr;
    scrubThumb.style.left   = pctStr;
    timeCurrent.textContent = formatTime(cur);
    timeTotal.textContent   = formatTime(dur);
}

// ─── EQ drawing ───────────────────────────────────────────────────────────────
function drawEQ() {
    if (!panelOpen || activeTab !== 'analysis') return;

    // if (eqCanvas.offsetWidth  !== eqCanvas.width)  eqCanvas.width  = eqCanvas.offsetWidth;
    // if (eqCanvas.offsetHeight !== eqCanvas.height) eqCanvas.height = eqCanvas.offsetHeight;

    // const w = eqCanvas.width;
    // const h = eqCanvas.height;
    // if (w <= 0 || h <= 0) return;

    // eqCtx.fillStyle = '#020208';
    // eqCtx.fillRect(0, 0, w, h);

    // Use clientWidth/Height to ignore borders and prevent clipping
    const w = eqCanvas.clientWidth;
    const h = eqCanvas.clientHeight;
    
    if (w <= 0 || h <= 0) return;

    if (eqCanvas.width !== w)  eqCanvas.width  = w;
    if (eqCanvas.height !== h) eqCanvas.height = h;

    eqCtx.fillStyle = '#020208';
    eqCtx.fillRect(0, 0, w, h);

    const activeAnalyser = liveMode ? liveAnalyser : (manager?.analyser ?? null);
    const activeContext  = liveMode ? liveContext  : (manager?.context  ?? null);

    if (!activeAnalyser || !activeContext) {
        eqCtx.fillStyle = 'rgba(100, 140, 190, 0.22)';
        eqCtx.font = '11px Segoe UI, system-ui, sans-serif';
        eqCtx.textAlign = 'center';
        eqCtx.fillText('No audio', w / 2, h / 2 + 4);
        return;
    }

    if (!eqByteData) eqByteData = new Uint8Array(activeAnalyser.frequencyBinCount);
    activeAnalyser.getByteFrequencyData(eqByteData);

    const binCount   = eqByteData.length;
    const sampleRate = activeContext.sampleRate;
    const freqPerBin = sampleRate / (binCount * 2);

    const minFreq  = 20;
    const maxFreq  = 20000;
    const LABEL_H  = 28;      // px reserved at bottom for two rows of freq labels + ticks
    const barAreaH = h - LABEL_H;
    const barCount = 144;
    const barW     = w / barCount;
    const minDb    = -100, maxDb = -30;

    const freqMarkers = [
        { f: 50,    text: '50',   row: 1 },
        { f: 75,    text: '75',   row: 1 },
        { f: 100,   text: '100',  row: 0 },
        { f: 250,   text: '250',  row: 1 },
        { f: 500,   text: '500',  row: 0 },
        { f: 1000,  text: '1k',   row: 1 },
        { f: 2000,  text: '2k',   row: 0 },
        { f: 5000,  text: '5k',   row: 1 },
        { f: 10000, text: '10k',  row: 0 },
        { f: 20000, text: '20k',  row: 0 },
    ];

    eqCtx.font = '7px Segoe UI, system-ui, sans-serif';
    eqCtx.textAlign = 'left';
    for (const db of [-30, -50, -70, -90]) {
        const frac = (db - minDb) / (maxDb - minDb);
        const y    = barAreaH * (1 - frac);
        eqCtx.strokeStyle = 'rgba(100, 140, 190, 0.1)';
        eqCtx.lineWidth   = 0.5;
        eqCtx.beginPath(); eqCtx.moveTo(0, y); eqCtx.lineTo(w, y); eqCtx.stroke();
        eqCtx.fillStyle   = 'rgba(140, 170, 215, 0.3)';
        eqCtx.fillText(`${db}`, 3, y - 1);
    }

    eqCtx.lineWidth = 0.5;
    for (const { f } of freqMarkers) {
        const t = Math.log(f / minFreq) / Math.log(maxFreq / minFreq);
        const x = t * w;
        eqCtx.strokeStyle = 'rgba(100, 140, 190, 0.1)';
        eqCtx.beginPath(); eqCtx.moveTo(x, 0); eqCtx.lineTo(x, barAreaH); eqCtx.stroke();
    }

    for (let i = 0; i < barCount; i++) {
        const t      = i / barCount;
        const tNext  = (i + 1) / barCount;
        const fLow   = minFreq * Math.pow(maxFreq / minFreq, t);
        const fHigh  = minFreq * Math.pow(maxFreq / minFreq, tNext);
        const bLow   = Math.max(0, Math.floor(fLow  / freqPerBin));
        const bHigh  = Math.min(binCount - 1, Math.ceil(fHigh / freqPerBin));

        // Use peak (max) rather than average — averaging dilutes high-frequency bars
        // because each high-freq bar spans many more FFT bins than a low-freq bar.
        let peak = 0;
        for (let b = bLow; b <= bHigh; b++) { if (eqByteData[b] > peak) peak = eqByteData[b]; }
        const barH = (peak / 255) * barAreaH;
        const x    = i * barW;
        const fMid = (fLow + fHigh) / 2;

        let r, g, b;
        if      (fMid <  200) { r = 0;   g = 200; b = 255; }
        else if (fMid < 2000) { r = 180; g = 100; b = 255; }
        else                  { r = 255; g = 200; b = 40;  }

        eqCtx.fillStyle = `rgba(${r},${g},${b},0.82)`;
        eqCtx.fillRect(x, barAreaH - barH, barW, barH);
    }

    eqCtx.strokeStyle = 'rgba(100, 140, 190, 0.2)';
    eqCtx.lineWidth   = 0.5;
    eqCtx.beginPath(); eqCtx.moveTo(0, barAreaH); eqCtx.lineTo(w, barAreaH); eqCtx.stroke();

    eqCtx.font = '9px Segoe UI, system-ui, sans-serif';
    for (const { f, text, row } of freqMarkers) {
        const t = Math.log(f / minFreq) / Math.log(maxFreq / minFreq);
        const x = t * w;

        // Tick mark (taller so it connects obviously to the label)
        eqCtx.strokeStyle = 'rgba(160, 200, 240, 0.55)';
        eqCtx.lineWidth   = 0.75;
        eqCtx.beginPath(); eqCtx.moveTo(x, barAreaH); eqCtx.lineTo(x, barAreaH + 5); eqCtx.stroke();

        // Label
        eqCtx.textAlign = x < 16 ? 'left' : (x > w - 16 ? 'right' : 'center');
        eqCtx.fillStyle = 'rgba(180, 210, 250, 0.82)';
        // row 0 → bottom row, row 1 → upper row (10px higher)
        eqCtx.fillText(text, x, h - 4 - row * 11);
    }
}

// ─── Detector graphs ─────────────────────────────────────────────────────────
const GRAPH_N         = 300;   // rolling sample window (~5 s at 60 fps)
const graphsContainer = document.getElementById('graphs-container');
const detectorGraphs  = [];    // { det, canvas, ctx, data:{flux,maxT,avgT,triggered}, yMax, color }

function initDetectorGraphs() {
    graphsContainer.innerHTML = '';
    detectorGraphs.length = 0;
    const defs = [
        ...blobs.filter(b => b.detector).map(b => ({ det: b.detector, color: b.color, label: b.name })),
        ...(subD ? [{ det: subD, color: '#e04060', label: 'Sub' }] : []),
    ];
    for (const { det, color, label } of defs) {
        const row = document.createElement('div');
        row.className = 'det-graph-row';
        const lbl = document.createElement('div');
        lbl.className = 'det-graph-lbl';
        lbl.style.color = color;
        lbl.textContent = label;
        const cv = document.createElement('canvas');
        cv.className = 'det-graph-cv';
        row.appendChild(lbl);
        row.appendChild(cv);
        graphsContainer.appendChild(row);
        detectorGraphs.push({
            det, canvas: cv, ctx: cv.getContext('2d'), color,
            data: { flux: [], maxT: [], avgT: [], triggered: [] },
            yMax: 0,
        });
    }
}

function updateDetectorGraphs() {
    for (const g of detectorGraphs) {
        const d = g.data;
        d.flux.push(g.det.currentFlux);
        d.maxT.push(g.det.maxLoudnessThresh);
        d.avgT.push(g.det.avgPeakThresh);
        d.triggered.push(g.det.justTriggered);
        if (d.flux.length > GRAPH_N) {
            d.flux.shift(); d.maxT.shift(); d.avgT.shift(); d.triggered.shift();
        }
    }
}

function drawDetectorGraphs() {
    if (!panelOpen || activeTab !== 'analysis') return;
    for (const g of detectorGraphs) {
        const cv = g.canvas;
        const gx = g.ctx;
        const w  = cv.clientWidth;
        const h  = cv.clientHeight;
        if (w <= 0 || h <= 0) continue;
        if (cv.width !== w)  cv.width  = w;
        if (cv.height !== h) cv.height = h;

        gx.fillStyle = '#020208';
        gx.fillRect(0, 0, w, h);

        const { flux, maxT, avgT, triggered } = g.data;
        const n = flux.length;
        if (n < 2) continue;

        // Smooth rolling Y ceiling so the axis doesn't jump on transients
        let dataMax = 0;
        for (let i = 0; i < n; i++) dataMax = Math.max(dataMax, flux[i], maxT[i], avgT[i]);
        g.yMax = Math.max(g.yMax * 0.995, dataMax * 1.15, 1e-9);
        const yMax = g.yMax;

        const xOf = i => ((i + GRAPH_N - n) / (GRAPH_N - 1)) * w;
        const yOf = v => h - (v / yMax) * h;

        // Trigger event — faint vertical tick at the moment of each trigger
        gx.lineWidth = 1;
        for (let i = 0; i < n; i++) {
            if (!triggered[i]) continue;
            gx.strokeStyle = g.color;
            gx.globalAlpha = 0.35;
            gx.beginPath(); gx.moveTo(xOf(i), 0); gx.lineTo(xOf(i), h); gx.stroke();
        }
        gx.globalAlpha = 1;

        // avgPeakThresh — noise-floor component; warm orange dashed
        _graphLine(gx, avgT, n, xOf, yOf, 'rgba(255,155,50,0.6)', 1, [3, 3]);

        // maxLoudnessThresh — decaying-peak component; detector color dim
        const [r, gc, b] = _hexRgb(g.color);
        _graphLine(gx, maxT, n, xOf, yOf, `rgba(${r},${gc},${b},0.45)`, 1, []);

        // Effective threshold = max of both — bright white dashed
        const effT = maxT.map((v, i) => Math.max(v, avgT[i]));
        _graphLine(gx, effT, n, xOf, yOf, 'rgba(255,255,255,0.8)', 1.5, [4, 3]);

        // Flux — filled area under the signal + solid line on top
        gx.beginPath();
        for (let i = 0; i < n; i++) {
            const x = xOf(i), y = yOf(flux[i]);
            i === 0 ? gx.moveTo(x, y) : gx.lineTo(x, y);
        }
        gx.lineTo(xOf(n - 1), h);
        gx.lineTo(xOf(0), h);
        gx.closePath();
        gx.fillStyle = `rgba(${r},${gc},${b},0.12)`;
        gx.fill();
        _graphLine(gx, flux, n, xOf, yOf, `rgba(${r},${gc},${b},0.9)`, 1.5, []);
    }
}

function _graphLine(ctx, vals, n, xOf, yOf, style, width, dash) {
    ctx.strokeStyle = style;
    ctx.lineWidth   = width;
    ctx.setLineDash(dash);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
        const x = xOf(i), y = yOf(vals[i]);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
}

function _hexRgb(hex) {
    const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [0, 200, 255];
}

// ─── Beat log ─────────────────────────────────────────────────────────────────
const LOG_MAX = 80;

function logBeat(name, lastTime, color = '#aaaaaa') {
    const now  = Date.now();
    const d    = new Date(now);
    const hh   = String(d.getHours()).padStart(2, '0');
    const mm   = String(d.getMinutes()).padStart(2, '0');
    const ss   = String(d.getSeconds()).padStart(2, '0');
    const ms   = String(d.getMilliseconds()).padStart(3, '0');
    const ivl  = lastTime ? ` +${now - lastTime}ms` : '';

    const el = document.createElement('div');
    el.className = 'log-entry';
    el.innerHTML =
        `<span class="log-time">${hh}:${mm}:${ss}.${ms}</span> ` +
        `<span class="log-det" style="color:${color}">${name}</span>` +
        `<span class="log-ivl">${ivl}</span>`;
    beatLog.appendChild(el);

    while (beatLog.children.length > LOG_MAX) beatLog.removeChild(beatLog.firstChild);
    beatLog.scrollTop = beatLog.scrollHeight;

    return now;
}

function fmtSliderVal(v, step) {
    const dec = String(step).includes('.') ? String(step).split('.')[1].length : 0;
    return v.toFixed(dec);
}
function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function buildColorShortcuts() {
    const container = document.getElementById('sliders-scroll');
    if (!container) return;
    let grp = document.getElementById('color-shortcuts-group');
    if (!grp) {
        grp = document.createElement('div');
        grp.id = 'color-shortcuts-group';
        grp.className = 'ctrl-group';
        container.insertBefore(grp, container.firstChild);
    }
    grp.innerHTML = '';
    const groupLabel = document.createElement('div');
    groupLabel.className = 'ctrl-group-label';
    groupLabel.textContent = 'Colors';
    grp.appendChild(groupLabel);
    const grid = document.createElement('div');
    grid.className = 'ctrl-color-grid';
    grp.appendChild(grid);

    function addSwatch(label, getHex, setHex) {
        const cell = document.createElement('div');
        cell.className = 'ctrl-color-cell';
        const lbl = document.createElement('span');
        lbl.className = 'ctrl-color-cell-lbl';
        lbl.textContent = label;
        lbl.title = label;
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.className = 'ctrl-color';
        inp.value = getHex();
        inp.addEventListener('input', () => setHex(inp.value));
        cell.appendChild(lbl);
        cell.appendChild(inp);
        grid.appendChild(cell);
    }

    // Static environment colors
    addSwatch('UW A',
        () => rgbToHex(UW_BLOB_R1, UW_BLOB_G1, UW_BLOB_B1),
        hex => { const [r,g,b] = hexToRgb(hex); UW_BLOB_R1=r; UW_BLOB_G1=g; UW_BLOB_B1=b; });
    addSwatch('UW B',
        () => rgbToHex(UW_BLOB_R2, UW_BLOB_G2, UW_BLOB_B2),

        () => rgbToHex(UW_PARTICLES_R, UW_PARTICLES_G, UW_PARTICLES_B),

}

// Builds (or rebuilds) the Frequencies group at the top of the sliders panel,
// with one Hz slider per blob using that blob's name and color as the label.
function buildFreqSliders() {
    buildColorShortcuts();
    const container = document.getElementById('sliders-scroll');
    if (!container) return;
    let freqGroup = document.getElementById('freq-group');
    if (!freqGroup) {
        freqGroup = document.createElement('div');
        freqGroup.id = 'freq-group';
        freqGroup.className = 'ctrl-group';
        const _colorGrp = document.getElementById('color-shortcuts-group');
        container.insertBefore(freqGroup, _colorGrp ? _colorGrp.nextSibling : container.firstChild);
    }
    freqGroup.innerHTML = '';
    const groupLabel = document.createElement('div');
    groupLabel.className = 'ctrl-group-label';
    groupLabel.textContent = 'Frequencies';
    freqGroup.appendChild(groupLabel);

    for (let bi = 0; bi < blobs.length; bi++) {
        const blob = blobs[bi];
        const row  = document.createElement('div');
        row.className = 'ctrl-row';

        const lbl = document.createElement('span');
        lbl.className   = 'ctrl-label';
        lbl.textContent = blob.name + ' Hz';
        lbl.title       = blob.name + ' Hz';
        // Use body color for label; fall back to effectColor if body is near-black
        const hx = blob.color.replace('#', '');
        const lr = parseInt(hx.slice(0,2), 16), lg = parseInt(hx.slice(2,4), 16), lb = parseInt(hx.slice(4,6), 16);
        lbl.style.color = (0.299*lr + 0.587*lg + 0.114*lb) < 30 ? (blob.effectColor || '#aaaaaa') : blob.color;
        row.appendChild(lbl);

        const slider = document.createElement('input');
        slider.type      = 'range';
        slider.className = 'ctrl-slider';
        slider.min = 20; slider.max = 20000; slider.step = 1;
        slider.value = blob.detectorHz;

        const val = document.createElement('input');
        val.type      = 'text';
        val.className = 'ctrl-val';
        val.value     = Math.round(blob.detectorHz);

        // Capture bi by value so the closure refers to the right blob
        slider.addEventListener('input', ((_bi) => () => {
            const v = parseFloat(slider.value);
            blobs[_bi].detectorHz = v;
            if (blobs[_bi].detector) { blobs[_bi].detector.targetHz = v; blobs[_bi].detector.reset(); }
            val.value = Math.round(v);
        })(bi));

        const _commitHz = ((_bi) => () => {
            const raw = parseFloat(val.value);
            if (isNaN(raw)) { val.value = Math.round(blobs[_bi].detectorHz); return; }
            const v = Math.min(20000, Math.max(20, Math.round(raw)));
            slider.value = v;
            blobs[_bi].detectorHz = v;
            if (blobs[_bi].detector) { blobs[_bi].detector.targetHz = v; blobs[_bi].detector.reset(); }
            val.value = v;
        })(bi);
        val.addEventListener('blur', _commitHz);
        val.addEventListener('keydown', e => { if (e.key === 'Enter') { _commitHz(); val.blur(); } });

        row.appendChild(slider);
        row.appendChild(val);
        freqGroup.appendChild(row);
    }

    for (let ci = 0; ci < clams.length; ci++) {
        const clam = clams[ci];
        const row  = document.createElement('div');
        row.className = 'ctrl-row';

        const lbl = document.createElement('span');
        lbl.className   = 'ctrl-label';
        lbl.textContent = clam.name + ' Hz';
        lbl.title       = clam.name + ' Hz';
        const [lr, lg, lb] = _hexRgb(clam.color);
        lbl.style.color = (0.299*lr + 0.587*lg + 0.114*lb) < 30 ? (clam.effectColor || '#aaaaaa') : clam.color;
        row.appendChild(lbl);

        const slider = document.createElement('input');
        slider.type      = 'range';
        slider.className = 'ctrl-slider';
        slider.min = 20; slider.max = 20000; slider.step = 1;
        slider.value = clam.detectorHz;

        const val = document.createElement('input');
        val.type      = 'text';
        val.className = 'ctrl-val';
        val.value     = Math.round(clam.detectorHz);

        slider.addEventListener('input', ((_ci) => () => {
            const v = parseFloat(slider.value);
            clams[_ci].detectorHz = v;
            if (clams[_ci].detector) { clams[_ci].detector.targetHz = v; clams[_ci].detector.reset(); }
            val.value = Math.round(v);
        })(ci));

        const _commitClamHz = ((_ci) => () => {
            const raw = parseFloat(val.value);
            if (isNaN(raw)) { val.value = Math.round(clams[_ci].detectorHz); return; }
            const v = Math.min(20000, Math.max(20, Math.round(raw)));
            slider.value = v;
            clams[_ci].detectorHz = v;
            if (clams[_ci].detector) { clams[_ci].detector.targetHz = v; clams[_ci].detector.reset(); }
            val.value = v;
        })(ci);
        val.addEventListener('blur', _commitClamHz);
        val.addEventListener('keydown', e => { if (e.key === 'Enter') { _commitClamHz(); val.blur(); } });

        row.appendChild(slider);
        row.appendChild(val);
        freqGroup.appendChild(row);
    }
}

function buildSliders() {
    const container = document.getElementById('sliders-scroll');
    if (!container) return;
    buildFreqSliders();

    for (const group of SLIDER_CONFIG) {
        const groupEl = document.createElement('div');
        groupEl.className = 'ctrl-group';

        const groupLabel = document.createElement('div');
        groupLabel.className = 'ctrl-group-label';
        groupLabel.textContent = group.group;
        groupEl.appendChild(groupLabel);

        for (const item of group.items) {
            const row = document.createElement('div');
            row.className = 'ctrl-row';

            const lbl = document.createElement('span');
            lbl.className   = 'ctrl-label';
            lbl.textContent = item.label;
            lbl.title       = item.label;
            row.appendChild(lbl);

            if (item.type === 'toggle') {
                // Boolean toggle switch
                const toggleLabel = document.createElement('label');
                toggleLabel.className = 'ctrl-toggle';
                const chk   = document.createElement('input');
                chk.type    = 'checkbox';
                chk.checked = item.get();
                const track = document.createElement('span');
                track.className = 'ctrl-toggle-track';
                toggleLabel.appendChild(chk);
                toggleLabel.appendChild(track);
                chk.addEventListener('change', () => item.set(chk.checked));
                row.appendChild(toggleLabel);
            } else if (item.type === 'color') {
                // Color picker — replaces R/G/B slider triplets
                const input = document.createElement('input');
                input.type      = 'color';
                input.className = 'ctrl-color';
                input.value     = item.get();
                input.addEventListener('input', () => item.set(input.value));
                row.appendChild(input);
            } else {
                // Standard range slider + value readout
                const slider = document.createElement('input');
                slider.type      = 'range';
                slider.className = 'ctrl-slider';
                slider.min       = item.min;
                slider.max       = item.max;
                slider.step      = item.step;
                slider.value     = item.get();

                const val = document.createElement('input');
                val.type      = 'text';
                val.className = 'ctrl-val';
                val.value     = fmtSliderVal(item.get(), item.step);

                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    item.set(v);
                    val.value = fmtSliderVal(v, item.step);
                });

                const _commitVal = () => {
                    const raw = parseFloat(val.value);
                    if (isNaN(raw)) { val.value = fmtSliderVal(parseFloat(slider.value), item.step); return; }
                    const clamped = Math.min(item.max, Math.max(item.min, raw));
                    const dec = String(item.step).includes('.') ? String(item.step).split('.')[1].length : 0;
                    const snapped = parseFloat((Math.round(clamped / item.step) * item.step).toFixed(dec));
                    slider.value = snapped;
                    item.set(snapped);
                    val.value = fmtSliderVal(snapped, item.step);
                };
                val.addEventListener('blur', _commitVal);
                val.addEventListener('keydown', e => { if (e.key === 'Enter') { _commitVal(); val.blur(); } });

                row.appendChild(slider);
                row.appendChild(val);
            }

            groupEl.appendChild(row);
        }

        container.appendChild(groupEl);
    }
}

// ─── Perceived energy ─────────────────────────────────────────────────────────
// ─── Underwater effects ────────────────────────────────────────────────────────
// Two independent layers:
//   Caustics  — large soft light blobs moving on slow Lissajous paths, drawn
//               with 'screen' composite so overlapping areas brighten naturally.
//   Particles — tiny motes drifting with a slowly rotating global current,
//               each with slight individual wobble.

function initUnderwater() {
    _uwCaustics = [];
    for (let i = 0; i < 10; i++) {
        _uwCaustics.push({
            cx: rand(canvas.width  * 0.05, canvas.width  * 0.95),
            cy: rand(canvas.height * 0.05, canvas.height * 0.95),
            ax: rand(50, canvas.width  * 0.22),  // Lissajous x amplitude
            ay: rand(40, canvas.height * 0.20),  // Lissajous y amplitude
            wx: rand(0.55, 1.45),                // x angular frequency
            wy: rand(0.45, 1.25),                // y angular frequency
            px: rand(0, Math.PI * 2),            // x phase offset
            py: rand(0, Math.PI * 2),            // y phase offset
            r:  rand(90, 210),                   // base radius (px)
            rp: rand(0, Math.PI * 2),            // breathing phase
            rw: rand(0.35, 1.1),                 // breathing frequency
            shape:    Math.floor(rand(0, 3)),    // 0=sphere 1=wide dome 2=tall narrow
            colorT:   rand(0, 1),                // palette interpolation 0=color A 1=color B
            angle:    rand(0, Math.PI * 2),      // current orientation
            angleVel: rand(-0.0003, 0.0003),     // slow rotation speed (rad/frame)
            flashT:       0,                     // 0=off, 0→1→0 during flash cycle
            flashPhase:   'idle',                // 'idle' | 'in' | 'out'
            flashElapsed: 0,                     // ms elapsed in current flash phase
            flashR: 0, flashG: 0, flashB: 0,     // target flash color (set on trigger)
        });
    }
    _uwParticles = [];
    for (let i = 0; i < 80; i++) {
        _uwParticles.push({
            x:     rand(0, canvas.width),
            y:     rand(0, canvas.height),
            r:     rand(0.5, 2.0),
            alpha: rand(0.55, 1.0),   // per-particle opacity factor (scaled by UW_PARTICLES_ALPHA)
            dvx:   rand(-0.08, 0.08), // individual x drift offset
            dvy:   rand(-0.06, 0.06), // individual y drift offset
            phase: rand(0, Math.PI * 2),
        });
    }
}

function updateUnderwater(dt) {
    const dtF = dt / 16.7;  // normalize to 60 fps
    _uwT          += UW_CAUSTICS_SPEED * dt;
    _uwCurrentAngle += 0.00018 * dtF;  // very slow current direction rotation

    for (const c of _uwCaustics) {
        c.angle += c.angleVel * dtF;
        if (c.flashPhase === 'in') {
            c.flashElapsed += dt;
            c.flashT = Math.min(1, c.flashElapsed / BLOB_FLASH_FADE_IN);
            if (c.flashT >= 1) { c.flashPhase = 'out'; c.flashElapsed = 0; }
        } else if (c.flashPhase === 'out') {
            c.flashElapsed += dt;
            c.flashT = 1 - Math.min(1, c.flashElapsed / BLOB_FLASH_FADE_OUT);
            if (c.flashT <= 0) { c.flashT = 0; c.flashPhase = 'idle'; }
        }
    }

    // Particle current trigger phase advance
    if (_particleTrigPhase === 'in') {
        _particleTrigElapsed += dt;
        _particleTrigT = Math.min(1, _particleTrigElapsed / PARTICLE_TRIGGER_FADE_IN);
        if (_particleTrigT >= 1) { _particleTrigPhase = 'out'; _particleTrigElapsed = 0; }
    } else if (_particleTrigPhase === 'out') {
        _particleTrigElapsed += dt;
        _particleTrigT = 1 - Math.min(1, _particleTrigElapsed / PARTICLE_TRIGGER_FADE_OUT);
        if (_particleTrigT <= 0) { _particleTrigT = 0; _particleTrigPhase = 'idle'; }
    }

    if (UW_PARTICLES_ENABLED) {
        let _effSpeed = UW_PARTICLES_SPEED;
        if (PARTICLE_TRIGGER_ENABLED && _particleTrigT > 0)
            _effSpeed += PARTICLE_TRIGGER_BOOST * Math.pow(_particleTrigT, PARTICLE_TRIGGER_SLOPE);
        if (PARTICLE_ENERGY_ENABLED)
            _effSpeed += PARTICLE_ENERGY_MIN + bgEnergySmooth * (PARTICLE_ENERGY_MAX - PARTICLE_ENERGY_MIN);
        const cx = Math.cos(_uwCurrentAngle) * _effSpeed * dtF;
        const cy = Math.sin(_uwCurrentAngle) * _effSpeed * dtF;
        const W = canvas.width, H = canvas.height;
        for (const p of _uwParticles) {
            p.phase += 0.008 * dtF;
            p.x += cx + p.dvx * dtF;
            p.y += cy + p.dvy * dtF + Math.sin(p.phase) * 0.05 * dtF;
            if (p.x < -4)    p.x = W + 4;
            else if (p.x > W + 4) p.x = -4;
            if (p.y < -4)    p.y = H + 4;
            else if (p.y > H + 4) p.y = -4;
        }
    }
}

function _flashHzParams(hz) {
    if (hz < 200)       return { rangeHz: 15,  octaves: 1, duration: 10 };
    else if (hz < 1000) return { rangeHz: 60,  octaves: 2, duration: 8  };
    else if (hz < 5000) return { rangeHz: 200, octaves: 2, duration: 6  };
    else                return { rangeHz: 500, octaves: 2, duration: 6  };
}

function triggerBlobFlash() {
    if (_uwCaustics.length === 0) return;
    if (BLOB_FLASH_ALL) {
        for (const c of _uwCaustics) {
            c.flashR = BLOB_FLASH_RANDOM ? (Math.random() * 255) | 0 : BLOB_FLASH_R;
            c.flashG = BLOB_FLASH_RANDOM ? (Math.random() * 255) | 0 : BLOB_FLASH_G;
            c.flashB = BLOB_FLASH_RANDOM ? (Math.random() * 255) | 0 : BLOB_FLASH_B;
            c.flashT = 0; c.flashPhase = 'in'; c.flashElapsed = 0;
        }
    } else {
        const c = _uwCaustics[Math.floor(Math.random() * _uwCaustics.length)];
        c.flashR = BLOB_FLASH_RANDOM ? (Math.random() * 255) | 0 : BLOB_FLASH_R;
        c.flashG = BLOB_FLASH_RANDOM ? (Math.random() * 255) | 0 : BLOB_FLASH_G;
        c.flashB = BLOB_FLASH_RANDOM ? (Math.random() * 255) | 0 : BLOB_FLASH_B;
        c.flashT = 0; c.flashPhase = 'in'; c.flashElapsed = 0;
    }
}

function triggerParticleCurrent() {
    _particleTrigT = 0;
    _particleTrigPhase = 'in';
    _particleTrigElapsed = 0;
}

function drawUnderwater() {
    if (UW_CAUSTICS_ENABLED && UW_CAUSTICS_ALPHA > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const c of _uwCaustics) {
            const x = c.cx + c.ax * Math.sin(c.wx * _uwT + c.px);
            const y = c.cy + c.ay * Math.cos(c.wy * _uwT + c.py);
            const r = c.r  * (1 + 0.15 * Math.sin(c.rw * _uwT + c.rp));
            const cr = Math.round(UW_BLOB_R1 + c.colorT * (UW_BLOB_R2 - UW_BLOB_R1));
            const cg = Math.round(UW_BLOB_G1 + c.colorT * (UW_BLOB_G2 - UW_BLOB_G1));
            const cb = Math.round(UW_BLOB_B1 + c.colorT * (UW_BLOB_B2 - UW_BLOB_B1));
            const ft = c.flashT > 0 ? Math.pow(c.flashT, BLOB_FLASH_SLOPE) : 0;
            const dr = ft > 0 ? Math.round(cr + ft * (c.flashR - cr)) : cr;
            const dg = ft > 0 ? Math.round(cg + ft * (c.flashG - cg)) : cg;
            const db = ft > 0 ? Math.round(cb + ft * (c.flashB - cb)) : cb;
            const a0 = UW_CAUSTICS_ALPHA * (1 + ft * 1.5);
            const a1 = UW_CAUSTICS_ALPHA * 0.28 * (1 + ft);
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0,    `rgba(${dr},${dg},${db},${a0.toFixed(4)})`);
            grad.addColorStop(0.4,  `rgba(${dr},${dg},${db},${a1.toFixed(4)})`);
            grad.addColorStop(0.75, `rgba(${dr},${dg},${db},${(a0 * 0.04).toFixed(4)})`);
            grad.addColorStop(1,    `rgba(${dr},${dg},${db},0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            if (c.shape === 1) {
                ctx.ellipse(x, y, r * 1.1, r * 0.9, c.angle, 0, Math.PI * 2);
            } else if (c.shape === 2) {
                ctx.ellipse(x, y, r * 0.9, r * 1.1, c.angle, 0, Math.PI * 2);
            } else {
                ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2);
            }
            ctx.fill();
        }
        ctx.restore();
    }

    if (UW_PARTICLES_ENABLED && UW_PARTICLES_ALPHA > 0) {
        ctx.save();
        ctx.fillStyle = `rgb(${UW_PARTICLES_R},${UW_PARTICLES_G},${UW_PARTICLES_B})`;
        for (const p of _uwParticles) {
            ctx.globalAlpha = p.alpha * UW_PARTICLES_ALPHA;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

// RMS of the time-domain waveform — measures signal power and correlates well
// with perceived loudness. Returns 0..1 (silence → full-scale square wave).
function computePerceivedEnergy(analyser) {
    if (!analyser) return 0;
    if (!bgTimeDomainData || bgTimeDomainData.length !== analyser.fftSize) {
        bgTimeDomainData = new Uint8Array(analyser.fftSize);
    }
    analyser.getByteTimeDomainData(bgTimeDomainData);
    let sumSq = 0;
    for (let i = 0; i < bgTimeDomainData.length; i++) {
        const s = (bgTimeDomainData[i] - 128) / 128;
        sumSq += s * s;
    }
    return Math.sqrt(sumSq / bgTimeDomainData.length);
}

// ─── Retro dither filter ──────────────────────────────────────────────────────
// Bayer 4×4 ordered dithering matrix — values 0–15, used as threshold offsets
// Bayer 4×4 ordered dithering matrix, flattened to a 16-entry array indexed by (y&3)*4+(x&3)
const _BAYER4_FLAT = new Uint8Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]);

// Precompute quantization LUT: lut[c*4096 + bayerVal*256 + inputByte] = outputByte.
// Encodes all float arithmetic (tint, threshold, round-to-level) as a table lookup,
// so the per-pixel loop only does 3 array reads per pixel instead of ~10 float ops.
function _buildDitherLUT() {
    const levels = Math.max(2, Math.round(DITHER_LEVELS));
    const step   = 1 / (levels - 1);
    const tstr   = DITHER_TINT_ENABLED ? DITHER_TINT_STR : 0;
    const tint   = [DITHER_TINT_R / 255, DITHER_TINT_G / 255, DITHER_TINT_B / 255];
    const lut    = new Uint8Array(3 * 16 * 256);
    for (let c = 0; c < 3; c++) {
        const tc   = tint[c];
        const base = c * 4096;
        for (let bv = 0; bv < 16; bv++) {
            const thresh = (_BAYER4_FLAT[bv] / 16 - 0.5) * step;
            const off    = base + bv * 256;
            for (let inp = 0; inp < 256; inp++) {
                let v = inp / 255;
                if (tstr > 0) v = v * (1 - tstr) + tc * tstr;
                v += thresh;
                if (v < 0) v = 0; else if (v > 1) v = 1;
                lut[off + inp] = Math.round(Math.round(v / step) * step * 255);
            }
        }
    }
    _ditherLUT = lut;
}

function applyDitherFilter() {
    if (!DITHER_ENABLED) return;
    const W = canvas.width, H = canvas.height;
    const ps = Math.max(2, Math.round(DITHER_PIXEL_SIZE));
    const dw = Math.max(1, Math.round(W / ps));
    const dh = Math.max(1, Math.round(H / ps));

    // Lazily create / resize the offscreen working canvas.
    // willReadFrequently tells the browser to keep pixels CPU-accessible, avoiding
    // a GPU→CPU pipeline stall on every getImageData call.
    if (!_ditherCanvas || _ditherCanvas.width !== dw || _ditherCanvas.height !== dh) {
        _ditherCanvas = document.createElement('canvas');
        _ditherCanvas.width  = dw;
        _ditherCanvas.height = dh;
        _ditherCtx = _ditherCanvas.getContext('2d', { willReadFrequently: true });
    }

    // Lazily rebuild the quantization LUT when settings have changed.
    if (!_ditherLUT) _buildDitherLUT();
    const lut = _ditherLUT;

    _ditherCtx.drawImage(canvas, 0, 0, dw, dh);
    const imgData = _ditherCtx.getImageData(0, 0, dw, dh);
    const d = imgData.data;

    // Per-pixel loop: 3 LUT lookups per pixel, no float arithmetic.
    // Each channel (R/G/B) uses a different Bayer row+col offset (c offset),
    // producing chromatic fringing at gradients — the "sparkle" effect.
    for (let y = 0; y < dh; y++) {
        // Precompute per-row Bayer base indices for each channel (avoids (y+c)&3 inside x-loop)
        const brR = (y    ) & 3;
        const brG = (y + 1) & 3;
        const brB = (y + 2) & 3;
        let i = y * dw * 4;
        for (let x = 0; x < dw; x++, i += 4) {
            const bcR = (x    ) & 3;
            const bcG = (x + 1) & 3;
            const bcB = (x + 2) & 3;
            d[i]   = lut[        _BAYER4_FLAT[brR * 4 + bcR] * 256 + d[i]  ];
            d[i+1] = lut[4096  + _BAYER4_FLAT[brG * 4 + bcG] * 256 + d[i+1]];
            d[i+2] = lut[8192  + _BAYER4_FLAT[brB * 4 + bcB] * 256 + d[i+2]];
        }
    }
    _ditherCtx.putImageData(imgData, 0, 0);

    // Upscale dithered result back at partial opacity so original colors bleed through
    ctx.save();
    ctx.globalAlpha = Math.min(1, Math.max(0, DITHER_OPACITY));
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'low';
    ctx.drawImage(_ditherCanvas, 0, 0, W, H);
    ctx.restore();

    // Scanlines — cheap horizontal overlay, drawn after upscale for crispness
    if (DITHER_SCAN_ENABLED && DITHER_SCAN_ALPHA > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(0,0,0,${DITHER_SCAN_ALPHA})`;
        const gap = Math.max(2, Math.round(DITHER_SCAN_GAP));
        for (let y = 0; y < H; y += gap) ctx.fillRect(0, y, W, 1);
        ctx.restore();
    }
}

// ─── Render loop ──────────────────────────────────────────────────────────────
function render() {
    requestAnimationFrame(render);

    let activeAnalyser = null;
    if (liveMode && liveAnalyser && liveContext) {
        liveAnalyser.getFloatFrequencyData(liveFreqData);
        for (const blob of blobs) {
            if (blob.detector) blob.detector.updateData(liveAnalyser, liveContext, liveFreqData);
        }
        if (subD) subD.updateData(liveAnalyser, liveContext, liveFreqData);
        if (BLOB_FLASH_ENABLED && _flashDetector) _flashDetector.updateData(liveAnalyser, liveContext, liveFreqData);
        if (PARTICLE_TRIGGER_ENABLED && _particleTrigDetector) _particleTrigDetector.updateData(liveAnalyser, liveContext, liveFreqData);
        for (const clam of clams) { if (clam.detector) clam.detector.updateData(liveAnalyser, liveContext, liveFreqData); }
        activeAnalyser = liveAnalyser;
    } else if (manager && playing) {
        manager.analyser.getFloatFrequencyData(manager.frequencyData);
        for (const blob of blobs) {
            if (blob.detector) blob.detector.updateData(manager.analyser, manager.context, manager.frequencyData);
        }
        if (subD) subD.updateData(manager.analyser, manager.context, manager.frequencyData);
        if (BLOB_FLASH_ENABLED && _flashDetector) _flashDetector.updateData(manager.analyser, manager.context, manager.frequencyData);
        if (PARTICLE_TRIGGER_ENABLED && _particleTrigDetector) _particleTrigDetector.updateData(manager.analyser, manager.context, manager.frequencyData);
        for (const clam of clams) { if (clam.detector) clam.detector.updateData(manager.analyser, manager.context, manager.frequencyData); }
        activeAnalyser = manager.analyser;
    }
    updateDetectorGraphs();

    // Perceived energy — RMS, fast-attack / slow-release smoothing
    const rmsEnergy = (BG_ENERGY_MAX_ALPHA > 0 || PARTICLE_ENERGY_ENABLED) ? computePerceivedEnergy(activeAnalyser) : 0;
    const emaAlpha  = rmsEnergy > bgEnergySmooth ? 0.25 : 0.06;
    bgEnergySmooth  = emaAlpha * rmsEnergy + (1 - emaAlpha) * bgEnergySmooth;

    const _now = performance.now();
    const _dt  = _lastRenderMs > 0 ? _now - _lastRenderMs : 16.7;
    _lastRenderMs = _now;
    if (_now - _lastPlaybarMs >= 250) { updatePlaybackBar(); _lastPlaybarMs = _now; }

    // Background
    if (frameCount === 0) {
        ctx.fillStyle = `rgb(${BG_R},${BG_G},${BG_B})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = `rgba(${BG_R},${BG_G},${BG_B},${BG_TRAIL_ALPHA})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    frameCount++;

    // Energy-driven background brightening — white overlay scaled by smoothed RMS
    if (bgEnergySmooth > 0.001 && BG_ENERGY_MAX_ALPHA > 0) {
        ctx.fillStyle = `rgba(255,255,255,${(bgEnergySmooth * BG_ENERGY_MAX_ALPHA).toFixed(4)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 150 Hz background wash — pale greyish-blue band rising from the bottom.
    // Full color at the very bottom, fading to transparent over the lower ~38% of the screen.
    // Overall intensity is driven by subD.parameter (fades in then out with the beat).
    if (subD && subD.parameter > 0) {
        const a      = subD.parameter;
        const cW     = canvas.width;
        const cH     = canvas.height;
        const bandH  = cH * SUB_BAND_HEIGHT;
        const grad   = ctx.createLinearGradient(0, cH - bandH, 0, cH);
        const col    = `${SUB_R|0}, ${SUB_G|0}, ${SUB_B|0}`;
        grad.addColorStop(0, `rgba(${col}, 0)`);
        grad.addColorStop(1, `rgba(${col}, ${(a * SUB_MAX_ALPHA).toFixed(3)})`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, cH - bandH, cW, bandH);
    }

    // Underwater effects — caustic light dapples and floating particle drift
    updateUnderwater(_dt);
    drawUnderwater();

    // Beat triggers — blob reaction + effects + log
    if (subD && subD.justTriggered) {
        lastSubLogTime = logBeat('Sub', lastSubLogTime, '#e04060');
    }
    if (BLOB_FLASH_ENABLED && _flashDetector && _flashDetector.justTriggered) {
        triggerBlobFlash();
    }
    if (PARTICLE_TRIGGER_ENABLED && _particleTrigDetector && _particleTrigDetector.justTriggered) {
        triggerParticleCurrent();
    }
    for (let bi = 0; bi < blobs.length; bi++) {
        const blob = blobs[bi];
        if (blob.detector && blob.detector.justTriggered) {
            triggerBlobBeat(bi);
            triggerBlobEffect(blob);
            blob._lastLogTime = logBeat(blob.name, blob._lastLogTime, blob.color);
            blob.triggerTimes.push(_now);
        }
    }
    for (let ci = 0; ci < clams.length; ci++) {
        const clam = clams[ci];
        if (clam.detector && clam.detector.justTriggered) {
            triggerClamBeat(ci);
            triggerBlobEffect(clam);   // reuse same effect system (shockwave/polygon/sparks)
            clam._lastLogTime = logBeat(clam.name, clam._lastLogTime, clam.color);
            clam.triggerTimes.push(_now);
        }
    }

    // Solo/duo state updates — must run after justTriggered is readable.
    // updateDuoLinks reads activitySmooth written by updateSpotlights, so order matters.
    updateSpotlights(_dt);
    updateDuoLinks(_dt);

    // Physics
    updateBlobs();
    updateClams();

    // Draw — spotlights → duo links → clams → blobs → effects
    drawSpotlights();
    drawDuoLinks();
    drawClams();
    drawBlobs();
    drawShockwaves();
    drawPolygonFlashes();
    drawSparks();
    applyDitherFilter();

    // Panel
    drawEQ();
    drawDetectorGraphs();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
resizeCanvas();
initBlobs();
buildSliders();
buildJelliList();
loadFileList();
window.addEventListener('resize', resizeCanvas);

// ─── Creature drag interaction (jellyfish + clams) ───────────────────────────
const DRAG_DETECT_R = 130;   // px — click must be within this radius of a creature center

function creatureUnderCursor(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    let nearest = null, nearestDist = Infinity, isClam = false;
    for (const blob of blobs) {
        const d = Math.hypot(x - blob.cx, y - blob.cy);
        if (d < DRAG_DETECT_R && d < nearestDist) { nearest = blob; nearestDist = d; isClam = false; }
    }
    for (const clam of clams) {
        const d = Math.hypot(x - clam.cx, y - clam.cy);
        if (d < DRAG_DETECT_R && d < nearestDist) { nearest = clam; nearestDist = d; isClam = true; }
    }
    return { creature: nearest, isClam, x, y };
}

canvas.addEventListener('mousedown', e => {
    const { creature, isClam, x, y } = creatureUnderCursor(e.clientX, e.clientY);
    if (!creature) return;
    if (isClam) { draggedClam = creature; } else { draggedBlob = creature; }
    dragCursorX = x;
    dragCursorY = y;
    _dragVelX = 0;
    _dragVelY = 0;
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
});

canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const { creature, isClam } = creatureUnderCursor(e.clientX, e.clientY);
    if (!creature) return;
    _editTarget  = { entity: creature, type: isClam ? 'clam' : 'jelli' };
    _spawnType   = isClam ? 'clam' : 'jelli';
    document.getElementById('spawn-modal-title').textContent = isClam ? 'Edit Clam' : 'Edit Jellyfish';
    document.getElementById('sp-name').value   = creature.name;
    document.getElementById('sp-hz').value     = creature.detectorHz;
    document.getElementById('sp-color').value  = creature.color;
    document.getElementById('sp-effect').value = creature.effect;
    document.getElementById('sp-ecol').value   = creature.effectColor;
    spEspeed.value = creature.effectSpeed;
    spEspeedVal.textContent = creature.effectSpeed.toFixed(1) + '×';
    spKick.value   = creature.kickScale;
    spKickVal.textContent = creature.kickScale.toFixed(1) + '×';
    spawnOkBtn.textContent = 'Apply';
    spawnModal.classList.add('open');
});

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const newX = e.clientX - rect.left;
    const newY = e.clientY - rect.top;
    // Smooth mouse velocity for momentum-on-release
    _dragVelX = _dragVelX * 0.6 + (newX - dragCursorX) * 0.4;
    _dragVelY = _dragVelY * 0.6 + (newY - dragCursorY) * 0.4;
    dragCursorX = newX;
    dragCursorY = newY;
    if (!draggedBlob && !draggedClam) {
        // Hover feedback — show grab cursor when over a creature
        const { creature } = creatureUnderCursor(e.clientX, e.clientY);
        canvas.style.cursor = creature ? 'grab' : 'default';
    }
});

document.addEventListener('mouseup', () => {
    if (draggedBlob) {
        draggedBlob.cvx += _dragVelX * DRAG_MOMENTUM;
        draggedBlob.cvy += _dragVelY * DRAG_MOMENTUM;
        draggedBlob = null;
    }
    if (draggedClam) {
        draggedClam.cvx += _dragVelX * DRAG_MOMENTUM;
        draggedClam.cvy += _dragVelY * DRAG_MOMENTUM;
        draggedClam = null;
    }
    canvas.style.cursor = 'default';
});

canvas.addEventListener('mouseleave', () => {
    draggedBlob = null;
    draggedClam = null;
    canvas.style.cursor = 'default';
});

render();
</script>

<div id="spawn-modal">
  <div id="spawn-card">
    <h3 id="spawn-modal-title">New Jellyfish</h3>
    <div class="sp-row">
      <span class="sp-lbl">Name</span>
      <input type="text" id="sp-name" value="Jelli" maxlength="20">
    </div>
    <div class="sp-row">
      <span class="sp-lbl">Hz</span>
      <input type="number" id="sp-hz" min="20" max="20000" value="100">
    </div>
    <div class="sp-row">
      <span class="sp-lbl">Body Color</span>
      <input type="color" id="sp-color" value="#00c8ff">
    </div>
    <div class="sp-row">
      <span class="sp-lbl">Effect</span>
      <select id="sp-effect">
        <option value="none">None</option>
        <option value="shockwave">Shockwave Ring</option>
        <option value="polygon">Polygon Flash</option>
        <option value="sparks">Spark Burst</option>
      </select>
    </div>
    <div class="sp-row">
      <span class="sp-lbl">Effect Color</span>
      <input type="color" id="sp-ecol" value="#00c8ff">
    </div>
    <div class="sp-row">
      <span class="sp-lbl">Effect Speed</span>
      <input type="range" id="sp-espeed" min="0.2" max="5" step="0.1" value="1">
      <span class="sp-val" id="sp-espeed-val">1.0×</span>
    </div>
    <div class="sp-row">
      <span class="sp-lbl">Kick Scale</span>
      <input type="range" id="sp-kick" min="0.1" max="3" step="0.1" value="1">
      <span class="sp-val" id="sp-kick-val">1.0×</span>
    </div>
    <div id="spawn-actions">
      <button id="spawn-cancel">Cancel</button>
      <button id="spawn-ok">Spawn</button>
    </div>
  </div>
</div>
</body>
